name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-runtime:
    name: installed runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt hatchling==1.33.0
      - run: python -m tools.accept_installed_runtime --receipt .acceptance/installed-runtime/receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: installed-runtime-${{ matrix.os }}
          path: .acceptance/installed-runtime/receipt.json

  installed-runtime-parity:
    name: installed runtime platform parity
    needs: installed-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: installed-runtime-*
          path: receipts
      - name: Compare complete package contents and compiler identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipts = [json.loads(path.read_text()) for path in Path('receipts').rglob('receipt.json')]
          assert len(receipts) == 2, 'both platform receipts are required'
          identity = lambda item: tuple(item[key] for key in ('version', 'contents_digest', 'implementation_digest'))
          assert identity(receipts[0]) == identity(receipts[1]), 'runtime release differs across platforms'
          PY

  test:
    needs: installed-runtime-parity
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_GC: "1"
      SUDOGRAPH_CI_RUNTIME_PARITY: ${{ needs.installed-runtime-parity.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.21.0"
      # Pinned. An unpinned linter is a gate whose meaning changes with whatever
      # PyPI served that morning: ruff 0.16 widened its defaults and turned a
      # green local run red here, which says nothing about the code.
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      # One step, because the list of gates lives in tools/verify.py and is the
      # same list a developer runs locally. Spelled out here a second time it
      # drifts, and it drifts by the local copy getting shorter — which is how
      # this build stayed red for five commits while every local run was green.
      - run: python -m tools.verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-browser-review
          path: .acceptance/browser-review

  native-host:
    name: native host contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # Pair the real host adapter with this compiler. An immutable revision
      # makes this gate reproducible instead of following unrelated host edits.
      - uses: actions/checkout@v4
        with:
          repository: sudoprivacy/sudowork
          ref: 48cf3c6b746864b3d5e89043b34171abdbf1de7f
          path: .host-acceptance/sudowork
          sparse-checkout: apps/desktop/src/process/services/ontology
          persist-credentials: false
      - run: pip install -r requirements.txt playwright==1.61.0
      - run: python -m playwright install --with-deps chromium
      - name: Accept the real host worker and live source reads
        run: python -m tools.accept_workspace_adapter --sudowork .host-acceptance/sudowork --receipt "${{ runner.temp }}/native-host-receipt.json"
      - name: Accept authenticated host review in real Chromium
        run: python -m tools.accept_review --sudowork .host-acceptance/sudowork --receipt "${{ runner.temp }}/native-host-browser/receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: native-host-acceptance
          path: |
            ${{ runner.temp }}/native-host-receipt.json
            ${{ runner.temp }}/native-host-browser
