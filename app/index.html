<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sudograph</title>
<!-- Vendored, not linked. An audit deliverable is opened from disk at a client
     site, and a CDN reference turns "open this file" into "open this file, on a
     machine with internet, on a day the CDN is up". Both libraries are MIT. -->
<script>/*__VENDOR__*/</script>
<style>
  :root{
    --bg:#11141a; --panel:#171b23; --line:#242a36; --ink:#dfe4ec; --dim:#8a93a6;
    --raw:#3f7f68; --hook:#9a6a2f; --derived:#3a5f9e; --type:#4a4f5c; --inst:#2c313c;
    --edge:#39404f; --entry:#c0503c; --carried:#7a5aa8; --bad:#c0503c; --ok:#3f7f68;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13px/1.55 -apple-system,"Segoe UI",system-ui,sans-serif;
       display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;
         padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:14px;margin:0 8px 0 0;font-weight:600;letter-spacing:.2px}
  label{font-size:11px;color:var(--dim);display:flex;gap:6px;align-items:center}
  select,button{background:#0e1117;color:var(--ink);border:1px solid var(--line);
                border-radius:5px;padding:4px 8px;font:inherit;font-size:12px}
  button{cursor:pointer}
  button.on{border-color:var(--entry);color:#fff}
  main{flex:1;display:flex;min-height:0}
  #cy{flex:1;min-width:0}
  aside{width:340px;border-left:1px solid var(--line);background:var(--panel);
        overflow:auto;padding:14px 16px}
  aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;
           color:var(--dim);margin:18px 0 8px;font-weight:600}
  aside h2:first-child{margin-top:0}
  .val{font-variant-numeric:tabular-nums;font-size:19px;font-weight:600}
  .op{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;
      background:#0e1117;border:1px solid var(--line);border-radius:5px;
      padding:7px 9px;white-space:pre-wrap;word-break:break-word;color:#b9c4d6}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;
      border-bottom:1px solid var(--line)}
  .kv span:first-child{color:var(--dim)}
  .kv span:last-child{text-align:right;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;
       border:1px solid var(--line)}
  .tag.full{color:#7fd3a8;border-color:#2e5c47}
  .tag.partial{color:#e0b563;border-color:#6b5325}
  .tag.missing{color:#e58974;border-color:#6e3a2e}
  ul{margin:5px 0;padding-left:17px}
  li{margin:2px 0}
  .fail{color:var(--bad)}
  /* The graph is SVG rather than canvas so that every label is real, selectable
     text. A canvas is one opaque element: nothing to select, nothing to point
     at, and therefore nothing an anchored comment can attach to. */
  #cy{cursor:grab;user-select:text;touch-action:none}
  #cy text{fill:#dfe4ec;font-size:11px;pointer-events:auto;cursor:text}
  #cy text.num{font-variant-numeric:tabular-nums;fill:#eef3fb;font-weight:600}
  #cy g.node rect{transition:stroke .12s}
  #cy g.node[data-open] > rect{fill-opacity:.16;stroke-dasharray:6 4}
  #cy g.node[data-kind=type][data-count]{cursor:pointer}
  #cy g.node.dim{opacity:.13}
  #cy g.node.hit rect{stroke:#e8eef8;stroke-width:3}
  #cy g.node.entry rect{stroke:var(--entry);stroke-width:4}
  #cy g.node.carriedN rect{stroke:var(--carried);stroke-width:3}
  .own{font-size:10px;padding:0 5px;border-radius:99px;border:1px solid var(--line);
       color:var(--dim);margin-left:4px}
  .own.source{color:#7fb3d3;border-color:#2d4a5c}
  .own.ontology{color:#d3a77f;border-color:#5c472d}
  .muted{color:var(--dim)}
  .entry{border-left:3px solid var(--entry);padding-left:9px;margin:9px 0}
  .carried{border-left:3px solid var(--carried);padding-left:9px;margin:9px 0}
  footer{padding:5px 16px;border-top:1px solid var(--line);background:var(--panel);
         font-size:11px;color:var(--dim);display:flex;gap:16px;flex-wrap:wrap;
         align-items:center}
  /* A legend, because the colours are the whole vocabulary and a reader who has
     to infer them is reading a puzzle. Business words, not the spec's field
     names: nobody outside this repo knows what a "hook" is. */
  /* In the header, not tucked into a footer corner: a legend nobody finds is
     a legend nobody has. The kinds are structural — a connector, a gap, a
     figure, an object type — so this stays four or five entries whatever the
     domain, and does not grow with the business vocabulary. */
  #legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-left:auto;
          font-size:11px;padding:3px 10px;border:1px solid var(--line);
          border-radius:6px;background:#0e1117}
  #legend span{display:flex;gap:5px;align-items:center;white-space:nowrap;color:var(--ink)}
  #legend i{width:11px;height:11px;border-radius:3px;display:inline-block;
            border:1px solid #2b3140}
  #legend u{width:17px;height:0;border-top:1.5px solid;display:inline-block}
  #legend u.dash{border-top-style:dashed}
  @media (max-width:800px){ main{flex-direction:column} aside{width:auto;height:44%;
    border-left:none;border-top:1px solid var(--line)} }
</style>
</head>
<body>
<header>
  <h1 id="title">sudograph</h1>
  <label>口径 <select id="basis"></select></label>
  <span id="dims" style="display:flex;gap:14px;flex-wrap:wrap"></span>
  <label>桥 <select id="bridge"></select></label>
  <button id="bridgeBtn">桥视图</button>
  <button id="instBtn">全部展开</button>
  <button id="fit">复位</button>
  <span id="legend"></span>
</header>
<main>
  <div id="cy"></div>
  <aside id="panel"><p class="muted">点一个节点看它的来历。</p></aside>
</main>
<footer><span id="status" style="display:flex;gap:16px;flex-wrap:wrap"></span></footer>

<script>
const BUNDLE = __BUNDLE__;

const $ = id => document.getElementById(id);
const fmt = v => (typeof v === 'number') ? v.toLocaleString('en-US') : (v ?? '—');
/* Instances are off by default. The scalar graph — raw, hooks, derived figures,
   types — is what a reviewer reads; the rows behind a type are a drill-down. On
   the real ledger the 31 instance nodes outnumber the 15 figures two to one and
   shrink every label past reading, which is the exact complaint that sent us
   away from a static diagram in the first place. Visibility is a view decision,
   so it belongs here; the figures still come only from the compiler. */
const state = { basis: BUNDLE.bases[0], at: {}, bridge: null, bridgeMode: false,
                expanded: new Set() };

/* ── controls ──────────────────────────────────────────────────────── */
$('title').textContent = BUNDLE.ontology;

for (const b of BUNDLE.bases) {
  if (b === null) continue;
  const o = document.createElement('option'); o.value = o.textContent = b;
  $('basis').appendChild(o);
}
if (BUNDLE.bases.length === 1 && BUNDLE.bases[0] === null) {
  $('basis').closest('label').style.display = 'none';
}
$('basis').onchange = e => { state.basis = e.target.value; draw(); };

for (const [dim, values] of Object.entries(BUNDLE.axes)) {
  const lab = document.createElement('label');
  lab.textContent = dim + ' ';
  const sel = document.createElement('select');
  for (const v of values) {
    const o = document.createElement('option');
    o.value = v === null ? '' : v;
    o.textContent = v === null ? '全部' : v;
    sel.appendChild(o);
  }
  sel.onchange = e => {
    if (e.target.value) state.at[dim] = e.target.value; else delete state.at[dim];
    draw();
  };
  lab.appendChild(sel); $('dims').appendChild(lab);
}

for (const br of BUNDLE.bridges) {
  const o = document.createElement('option');
  o.value = br.name; o.textContent = br.label;
  $('bridge').appendChild(o);
}
if (!BUNDLE.bridges.length) {
  $('bridge').closest('label').style.display = 'none';
  $('bridgeBtn').style.display = 'none';
} else {
  state.bridge = BUNDLE.bridges[0].name;
  $('bridge').onchange = e => { state.bridge = e.target.value; draw(); };
  $('bridgeBtn').onclick = () => {
    state.bridgeMode = !state.bridgeMode;
    $('bridgeBtn').classList.toggle('on', state.bridgeMode);
    draw();
  };
}

/* ── the compiler already decided everything; we only look it up ───── */
const coordKey = () =>
  Object.keys(state.at).sort().map(k => `${k}=${state.at[k]}`).join(',');
const view   = () => BUNDLE.views[`${state.basis ?? ''}|${coordKey()}`];
const bridge = () => BUNDLE.diffs[`${state.bridge || defaultBridgeName()}|${coordKey()}`];
function defaultBridgeName() {
  const b = BUNDLE.bridges[0];
  return b ? (b.name || `${b.from}->${b.to}`) : '';
}

/* One table. The renderer colours nodes from it, the legend is built from it,
   and ELK's layer constraint is read from it — so a new kind cannot appear on
   the canvas without a name in the legend and a row to sit on. */
const KINDS = {
  raw:      { var:'--raw',      name:'取数点',     layer:'FIRST' },
  hook:     { var:'--hook',     name:'缺口'                      },
  derived:  { var:'--derived',  name:'算出来的数'                },
  type:     { var:'--type',     name:'对象类型'                  },
  instance: { var:'--inst'                                       },
};
const GRADE = { partial:['#6b5325','部分'], missing:['#6e3a2e','缺失'] };
const EDGES = {
  flow:    { dash:'', colour:'--edge', name:'流向'      },
  affects: { dash:'dash', colour:'--hook', name:'使它暂定' },
};
const edgeStyle = rel => EDGES[rel === 'affects' ? 'affects' : 'flow'];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

$('legend').innerHTML =
  Object.values(KINDS).filter(k => k.name)
    .map(k => `<span><i style="background:var(${k.var})"></i>${k.name}</span>`).join('') +
  Object.values(EDGES)
    .map(e => `<span><u class="${e.dash}" style="border-top-color:${
      css(e.colour)}"></u>${e.name}</span>`).join('') +
  `<span>边框：` + Object.values(GRADE)
    .map(([c, label]) => `<i style="background:transparent;border-color:${c}"></i>${label}`)
    .join('') + `</span>`;

/* Rendered as SVG, not canvas, and the reason is commenting rather than taste.
   A canvas is one opaque element: no text to select and no element to point at,
   so an anchored comment has nothing to attach to and a drag-select can only
   grab the whole picture. Every node here is a real <g> carrying real <text>
   and a data-node-id — selectable today, and addressable later if anchors ever
   key on identity instead of quoted text.

   Layout is still ELK. That was never cytoscape's contribution: cytoscape-elk
   is an 11 KB adapter that calls elkjs, so dropping cytoscape keeps the layout
   and loses 365 KB. Canvas would win on thousands of nodes; this graph is a few
   hundred SVG elements, two orders short of where that matters, and the
   instance rows that could grow are folded by the compiler anyway. */
const SVGNS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}) => {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
};
const elk = new ELK();
const pz = { x: 0, y: 0, k: 1 };
let scene = null, lastLaid = null;

function measure(label, value) {
  const lines = [label, value].filter(x => x != null && x !== '');
  // CJK is about one em per character, Latin about half. ELK only needs the
  // extents, not perfection.
  const widest = Math.max(...lines.map(t =>
    [...String(t)].reduce((w, c) => w + (c.charCodeAt(0) > 0x2e80 ? 12 : 6.6), 0)));
  return { w: Math.min(Math.max(widest + 24, 72), 260), h: lines.length > 1 ? 44 : 30 };
}

async function draw() {
  const v = view();
  if (!v) { $('status').textContent = 'no view for this combination'; return; }

  const d = state.bridgeMode ? bridge() : null;
  const entries = new Set((d?.entries || []).map(e => e.node));
  const carried = new Set((d?.carried || []).map(c => c.node));

  const shown = new Map();
  for (const n of v.nodes) {
    if (n.kind === 'instance' && !state.expanded.has(n.type)) continue;
    shown.set(n.id, n);
  }
  // Same rule the compiler follows: an edge whose other end is not on the canvas
  // is not drawn, rather than drawn to a node invented for it.
  const edges = v.edges.filter(e => shown.has(e.from) && shown.has(e.to));

  // Instances are laid out *inside* their type rather than beside it. Expanding
  // a type used to scatter its rows across the picture with nothing to say where
  // they had come from; nesting them means the answer is the box they are in.
  const box = (n) => {
    const m = measure(n.label, n.value != null ? fmt(n.value) : null);
    const c = { id: n.id, width: m.w, height: m.h };
    const pin = (KINDS[n.kind] || {}).layer;
    if (pin) c.layoutOptions = { 'elk.layered.layering.layerConstraint': pin };
    return c;
  };
  const kids = new Map();
  for (const n of shown.values())
    if (n.kind === 'instance') (kids.get(n.type) || kids.set(n.type, []).get(n.type)).push(n);

  const children = [];
  for (const n of shown.values()) {
    if (n.kind === 'instance') continue;
    const c = box(n);
    const mine = kids.get(n.id);
    if (mine?.length) {
      c.children = mine.map(box);
      c.layoutOptions = {
        ...(c.layoutOptions || {}),
        'elk.padding': '[top=34,left=14,bottom=14,right=14]',
        'elk.algorithm': 'rectpacking',
        'elk.aspectRatio': '2.4',
      };
    }
    children.push(c);
  }

  const laid = await elk.layout({
    id: 'root',
    layoutOptions: {
      'elk.algorithm': 'layered', 'elk.direction': 'DOWN',
      'elk.layered.spacing.nodeNodeBetweenLayers': '80',
      'elk.spacing.nodeNode': '34',
      'elk.layered.nodePlacement.strategy': 'NETWORK_SIMPLEX',
      'elk.hierarchyHandling': 'INCLUDE_CHILDREN',
      // Left to itself ELK lays this out very wide and very short, which wastes
      // the height and shrinks every label to fit the width.
      'elk.aspectRatio': '1.4',
    },
    children,
    edges: edges
      .filter(e => !(shown.get(e.to)?.kind === 'instance' && e.rel === 'member'))
      .map((e, i) => ({ id: 'e' + i, sources: [e.from], targets: [e.to] })),
  });
  lastLaid = laid;

  // Nested children carry coordinates relative to their parent; flatten once so
  // the renderer only ever deals in absolute positions.
  const pos = new Map();
  (function walk(list, ox, oy) {
    for (const c of list || []) {
      pos.set(c.id, { ...c, x: c.x + ox, y: c.y + oy });
      walk(c.children, c.x + ox, c.y + oy);
    }
  })(laid.children, 0, 0);
  const svg = el('svg', { width: '100%', height: '100%' });
  const defs = el('defs');
  for (const [name, e] of Object.entries(EDGES)) {
    const m = el('marker', { id: 'arw-' + name, viewBox: '0 0 10 10', refX: '9',
      refY: '5', markerWidth: '6', markerHeight: '6', orient: 'auto-start-reverse' });
    m.appendChild(el('path', { d: 'M0,0 L10,5 L0,10 z', fill: css(e.colour) }));
    defs.appendChild(m);
  }
  svg.appendChild(defs);
  scene = el('g');
  svg.appendChild(scene);
  const gEdges = el('g'); scene.appendChild(gEdges);
  const gNodes = el('g'); scene.appendChild(gNodes);

  for (const [i, e] of edges.entries()) {
    const sec = (laid.edges || []).find(x => x.id === 'e' + i)?.sections?.[0];
    if (!sec) continue;
    const pts = [sec.startPoint, ...(sec.bendPoints || []), sec.endPoint];
    const p = el('path', {
      d: pts.map((q, j) => (j ? 'L' : 'M') + q.x + ',' + q.y).join(' '),
      fill: 'none',
      'stroke-width': e.rel === 'links' ? 2 : 1.2,
      stroke: css(edgeStyle(e.rel).colour),
      'marker-end': 'url(#arw-' + (e.rel === 'affects' ? 'affects' : 'flow') + ')',
      opacity: e.rel === 'member' ? 0.22 : 0.7,
    });
    if (edgeStyle(e.rel).dash) p.setAttribute('stroke-dasharray', '5 4');
    gEdges.appendChild(p);
  }

  for (const n of shown.values()) {
    const p = pos.get(n.id); if (!p) continue;
    const g = el('g', { transform: 'translate(' + p.x + ',' + p.y + ')', class: 'node' });
    // The hook an identity-based anchor would key on, and what a reader is
    // selecting when they drag across a label today.
    g.dataset.nodeId = n.id;
    g.dataset.kind = n.kind;
    if (n.count) g.dataset.count = n.count;
    if (n.kind === 'type' && state.expanded.has(n.id)) g.dataset.open = '1';
    if (entries.has(n.id)) g.classList.add('entry');
    else if (carried.has(n.id)) g.classList.add('carriedN');
    else if (d) g.classList.add('dim');
    g.appendChild(el('rect', {
      width: p.width, height: p.height, rx: 6,
      fill: css((KINDS[n.kind] || KINDS.type).var),
      stroke: (GRADE[n.completeness] || ['#2b3140'])[0],
      'stroke-width': 2,
    }));
    const open = n.kind === 'type' && state.expanded.has(n.id);
    const val = n.value != null ? fmt(n.value) : null;
    // A type says how many rows it holds and whether they are showing, so the
    // way in is visible rather than something to discover by toggling.
    const head = n.kind === 'type' && n.count
      ? `${n.label}  ${open ? '▾' : '▸'}${n.count}` : n.label;
    const t1 = el('text', {
      x: open ? 10 : p.width / 2, y: val ? 18 : 19,
      'text-anchor': open ? 'start' : 'middle' });
    t1.textContent = head;
    g.appendChild(t1);
    if (val) {
      const t2 = el('text', { x: p.width / 2, y: 34, 'text-anchor': 'middle', class: 'num' });
      t2.textContent = val;
      g.appendChild(t2);
    }
    g.addEventListener('click', ev => {
      ev.stopPropagation();
      if (n.kind === 'type' && n.count) {
        state.expanded.has(n.id) ? state.expanded.delete(n.id) : state.expanded.add(n.id);
        draw().then(() => select(n));
        return;
      }
      select(n);
    });
    gNodes.appendChild(g);
  }

  $('cy').replaceChildren(svg);
  refit();

  const bad = v.checks.filter(c => !c.ok);
  $('status').innerHTML =
    `<span>${shown.size} 节点 · ${edges.length} 边</span>` +
    `<span class="${bad.length ? 'fail' : ''}">${v.checks.length - bad.length}/${v.checks.length} 检查通过</span>` +
    (d ? `<span>桥 ${d.bases[0]} → ${d.bases[1]}：${d.entries.length} 条分录，过账 ${fmt(d.posted)}</span>` : '');

  if (d) showBridge(d); else showChecks(v);
}

function select(n) {
  for (const g of scene.querySelectorAll('g.node')) g.classList.remove('hit');
  const mark = id => scene
    .querySelector('g.node[data-node-id="' + CSS.escape(id) + '"]')?.classList.add('hit');
  mark(n.id);
  // Lineage is the question a reviewer actually asks of a figure.
  for (const a of (n.lineage?.ancestors || [])) mark(a);
  showNode(n);
}

function applyTransform() {
  if (scene) scene.setAttribute('transform',
    'translate(' + pz.x + ',' + pz.y + ') scale(' + pz.k + ')');
}

/* Pointer events rather than mouse events, so a finger, a pen and a mouse all
   take the same path and two fingers pinch. Dropping cytoscape meant giving up
   its input handling; leaving touch out would have made the graph unusable on a
   phone, which is a worse regression than anything this rewrite was for. */
(function wirePanZoom() {
  const host = $('cy');
  const live = new Map();          // pointerId -> {x, y}
  let drag = null, pinch = null;
  const dist = ps => Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y);
  const mid  = ps => ({ x: (ps[0].x + ps[1].x) / 2, y: (ps[0].y + ps[1].y) / 2 });

  function zoomAt(k, cx, cy) {
    const box = host.getBoundingClientRect();
    const mx = cx - box.left, my = cy - box.top;
    k = Math.min(Math.max(k, 0.15), 6);
    pz.x = mx - (mx - pz.x) * (k / pz.k);
    pz.y = my - (my - pz.y) * (k / pz.k);
    pz.k = k;
    applyTransform();
  }

  host.addEventListener('pointerdown', e => {
    live.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (live.size === 2) {
      const ps = [...live.values()];
      pinch = { d: dist(ps), k: pz.k };
      drag = null;
      return;
    }
    // A drag that starts on a label is a text selection, and selecting text is
    // how a comment gets anchored — so it is left alone.
    if (e.target.tagName === 'text') return;
    drag = { x: e.clientX, y: e.clientY, ox: pz.x, oy: pz.y, id: e.pointerId };
    host.setPointerCapture?.(e.pointerId);
    host.style.cursor = 'grabbing';
  });

  host.addEventListener('pointermove', e => {
    if (!live.has(e.pointerId)) return;
    live.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && live.size === 2) {
      const ps = [...live.values()], c = mid(ps);
      zoomAt(pinch.k * (dist(ps) / pinch.d), c.x, c.y);
      return;
    }
    if (!drag || e.pointerId !== drag.id) return;
    pz.x = drag.ox + (e.clientX - drag.x);
    pz.y = drag.oy + (e.clientY - drag.y);
    applyTransform();
  });

  const release = e => {
    live.delete(e.pointerId);
    if (live.size < 2) pinch = null;
    if (drag && e.pointerId === drag.id) { drag = null; host.style.cursor = ''; }
  };
  host.addEventListener('pointerup', release);
  host.addEventListener('pointercancel', release);
  host.addEventListener('pointerleave', release);

  host.addEventListener('wheel', e => {
    e.preventDefault();
    zoomAt(pz.k * Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY);
  }, { passive: false });

  host.addEventListener('click', () => {
    for (const g of (scene?.querySelectorAll('g.node') || [])) g.classList.remove('hit');
  });
})();

function showNode(n) {
  const rows = [];
  rows.push(`<h2>${n.kind}</h2><div style="font-size:15px;font-weight:600">${n.label}</div>`);
  if (n.value != null) rows.push(`<div class="val">${fmt(n.value)}</div>`);
  if (n.completeness)
    rows.push(`<p><span class="tag ${n.completeness}">${n.completeness}</span></p>`);
  if (n.op) rows.push(`<h2>表达式</h2><div class="op">${n.op}</div>`);
  if (n.resolve_when) rows.push(`<h2>解除条件</h2><p>${n.resolve_when}</p>`);
  if (n.owner) rows.push(`<div class="kv"><span>负责人</span><span>${n.owner}</span></div>`);
  if (n.connector) rows.push(`<h2>取数</h2><div class="op">${n.connector}</div>`);
  if (n.provisional_because?.length)
    rows.push(`<h2>因这些缺口而暂定</h2><ul>${n.provisional_because.map(h => `<li>${h}</li>`).join('')}</ul>`);
  if (n.lineage?.inputs?.length)
    rows.push(`<h2>直接输入</h2><ul>${n.lineage.inputs.map(x => `<li>${x}</li>`).join('')}</ul>`);
  if (n.lineage?.leaves?.length)
    rows.push(`<h2>最终依赖的叶子</h2><ul>${n.lineage.leaves.map(x => `<li>${x}</li>`).join('')}</ul>`);
  if (n.residual != null)
    rows.push(`<div class="kv"><span>残差</span><span>${fmt(n.residual)}</span></div>`);
  // Every property is either an upstream fact or a decision made here, never
  // both. It is the hardest rule in the model and the app was not showing it,
  // which made the panel a list of numbers with no idea who owns any of them.
  if (n.props) {
    const owners = (view().groups.find(g => g.type === n.type) || {}).owners || {};
    rows.push(`<h2>属性</h2>` + Object.entries(n.props).map(([k, val]) =>
      `<div class="kv"><span>${k} <span class="own ${owners[k] || ''}">${
        owners[k] === 'source' ? '上游' : owners[k] === 'ontology' ? '本体' : ''
      }</span></span><span>${fmt(val)}</span></div>`).join(''));
  }
  if (n.kind === 'type') rows.push(showGroup(n.id));
  $('panel').innerHTML = rows.join('');
}

/* Folding produces buckets and a top-N precisely so a folded group still answers
   the two questions a person asks of a long list — how does it break down, and
   which rows carry the weight. Ignoring them made folding mean "hidden". */
function showGroup(tname) {
  const g = view().groups.find(x => x.type === tname);
  if (!g) return '';
  const out = [`<h2>${g.count} 行${g.folded ? '（已折叠）' : ''}</h2>`];
  for (const [axis, buckets] of Object.entries(g.buckets || {})) {
    out.push(`<h2>按 ${axis}</h2>`);
    for (const b of buckets) {
      const totals = Object.entries(b.totals || {})
        .map(([c, t]) => `${c} ${fmt(t)}`).join(' · ');
      out.push(`<div class="kv"><span>${b.value ?? '—'} <span class="muted">${
        b.count}</span></span><span>${totals}</span></div>`);
    }
  }
  for (const [col, rows_] of Object.entries(g.top || {})) {
    if (!rows_.length) continue;
    out.push(`<h2>${col} 最大的 ${rows_.length} 条</h2>`);
    for (const r of rows_)
      out.push(`<div class="kv"><span>${r.id}</span><span>${fmt(r.value)}</span></div>`);
  }
  return out.join('');
}

function showChecks(v) {
  const bad = v.checks.filter(c => !c.ok);
  $('panel').innerHTML = bad.length
    ? `<h2>未通过的检查</h2>` + bad.map(c =>
        `<div class="entry"><strong>${c.name}</strong><div class="muted">${c.detail}</div></div>`).join('')
    : `<h2>检查</h2><p class="muted">${v.checks.length} 条全部通过。点一个节点看它的来历。</p>`;
}

function showBridge(d) {
  const part = [`<h2>调整分录</h2>`];
  for (const e of d.entries) {
    part.push(`<div class="entry"><strong>${e.label}</strong>
      <div class="val">${fmt(e.amount)}</div>
      <div class="muted">${fmt(e.before)} → ${fmt(e.after)}</div>
      ${e.debit ? `<div>借 ${e.debit} · 贷 ${e.credit}</div>` : '<div class="muted">备查，不过账</div>'}
      <div class="muted">因为 ${e.because}</div></div>`);
  }
  part.push(`<div class="kv"><span>过账合计</span><span>${fmt(d.posted)}</span></div>`);
  if (d.carried.length) {
    part.push(`<h2>顺带变动</h2><p class="muted">由上面的分录带动，不重复入账。</p>`);
    for (const c of d.carried)
      part.push(`<div class="carried"><strong>${c.label}</strong>
        <div>${fmt(c.amount)}</div>
        <div class="muted">来自 ${c.origins.join('、') || '—'}</div></div>`);
  }
  if (d.unexplained.length)
    part.push(`<h2 class="fail">无法解释</h2><ul class="fail">${
      d.unexplained.map(x => `<li>${x}</li>`).join('')}</ul>`);
  $('panel').innerHTML = part.join('');
}

$('instBtn').onclick = () => {
  const all = view().nodes.filter(n => n.kind === 'type' && n.count).map(n => n.id);
  const anyClosed = all.some(t => !state.expanded.has(t));
  state.expanded = new Set(anyClosed ? all : []);
  draw();
};
/* Fit, then refuse to shrink past legibility. A graph scaled until the labels
   are grey mush answers nothing; better to start readable and let the reader
   pan, which is the whole reason this is a live canvas and not a picture. */
function refit() {
  if (!lastLaid) return;
  const W = lastLaid.width || 1, H = lastLaid.height || 1;
  const box = $('cy').getBoundingClientRect();
  if (!box.width || !box.height) return;
  pz.k = Math.max(Math.min((box.width - 60) / W, (box.height - 60) / H, 1.4), 0.55);
  pz.x = (box.width - W * pz.k) / 2;
  pz.y = (box.height - H * pz.k) / 2;
  applyTransform();
}

/* The container is not its final size when the layout finishes — an embed sizes
   its frame after load, and a window or a phone changes it later. Fitting once
   against a stale viewport is how the right-hand nodes end up clipped, which is
   exactly how this first shipped inside a ShareOne frame. */
new ResizeObserver(() => refit()).observe($('cy'));

$('fit').onclick = refit;
draw();
</script>
