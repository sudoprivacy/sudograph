<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sudograph</title>
<!-- Vendored, not linked. A deliverable is opened from disk at a client
     site, and a CDN reference turns "open this file" into "open this file, on a
     machine with internet, on a day the CDN is up". Both libraries are MIT. -->
<script>/*__VENDOR__*/</script>
<style>
  :root{
    --bg:#11141a; --panel:#171b23; --line:#242a36; --ink:#dfe4ec; --dim:#8a93a6;
    --raw:#3f7f68; --hook:#9a6a2f; --derived:#3a5f9e; --type:#4a4f5c; --inst:#2c313c;
    --edge:#39404f; --entry:#c0503c; --carried:#7a5aa8; --bad:#c0503c; --ok:#3f7f68;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13px/1.55 -apple-system,"Segoe UI",system-ui,sans-serif;
       display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
         padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:14px;margin:0 8px 0 0;font-weight:600;letter-spacing:.2px}
  label{font-size:11px;color:var(--dim);display:flex;gap:6px;align-items:center}
  select,button{background:#0e1117;color:var(--ink);border:1px solid var(--line);
                border-radius:5px;padding:4px 8px;font:inherit;font-size:12px}
  button{cursor:pointer}
  button.on{border-color:var(--entry);color:#fff}
  main{flex:1;display:flex;min-height:0}
  #cy{flex:1;min-width:0;position:relative;overflow:hidden}
  /* The panel sits on the left because the carrier puts comments on the right:
     two columns of text on the same edge means the one you are reading and the
     one you are writing overlap, and a reader loses whichever is underneath. */
  aside{order:-1;width:340px;border-right:1px solid var(--line);background:var(--panel);
        overflow:auto;padding:14px 16px}
  aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;
           color:var(--dim);margin:18px 0 8px;font-weight:600}
  aside h2:first-child{margin-top:0}
  .val{font-variant-numeric:tabular-nums;font-size:19px;font-weight:600}
  .op{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;
      background:#0e1117;border:1px solid var(--line);border-radius:5px;
      padding:7px 9px;white-space:pre-wrap;word-break:break-word;color:#b9c4d6}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;
      border-bottom:1px solid var(--line)}
  .kv span:first-child{color:var(--dim)}
  .kv span:last-child{text-align:right;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;
       border:1px solid var(--line)}
  .tag.full{color:#7fd3a8;border-color:#2e5c47}
  .tag.partial{color:#e0b563;border-color:#6b5325}
  .tag.missing{color:#e58974;border-color:#6e3a2e}
  ul{margin:5px 0;padding-left:17px}
  li{margin:2px 0}
  .fail{color:var(--bad)}
  /* Canvas nodes have selectable DOM labels and application identity anchors.
     These SVG rules also support the fallback renderer. */
  #cy{cursor:grab;user-select:text;touch-action:none}
  #cy text{fill:#dfe4ec;font-size:11px;pointer-events:auto;cursor:text}
  #cy text.num{font-variant-numeric:tabular-nums;fill:#eef3fb;font-weight:600}
  #cy text.sub{font-variant-numeric:tabular-nums;fill:var(--hook);font-size:10px}
  #cy tspan.mark{fill:var(--dim);font-variant-numeric:tabular-nums}
  #cy g.node rect{transition:stroke .12s}
  #cy g.closer{cursor:pointer}
  #cy text.closer-mark{fill:var(--dim);font-size:15px;cursor:pointer}
  #cy g.closer:hover text.closer-mark{fill:#dfe4ec}
  #cy g.node[data-open] > rect{fill-opacity:.16;stroke-dasharray:6 4}
  #cy g.node[data-kind=type][data-count]{cursor:pointer}
  #cy g.node.dim{opacity:.13}
  #cy g.node.hit rect{stroke:#e8eef8;stroke-width:3}
  #cy g.node.entry rect{stroke:var(--entry);stroke-width:4}
  #cy g.node.carriedN rect{stroke:var(--carried);stroke-width:3}
  .own{font-size:10px;padding:0 5px;border-radius:99px;border:1px solid var(--line);
       color:var(--dim);margin-left:4px}
  .own.source{color:#7fb3d3;border-color:#2d4a5c}
  .own.ontology{color:#d3a77f;border-color:#5c472d}
  .muted{color:var(--dim)}
  .entry{border-left:3px solid var(--entry);padding-left:9px;margin:9px 0}
  .carried{border-left:3px solid var(--carried);padding-left:9px;margin:9px 0}
  footer{padding:5px 16px;border-top:1px solid var(--line);background:var(--panel);
         font-size:11px;color:var(--dim);display:flex;gap:16px;flex-wrap:wrap;
         align-items:center}
  /* A legend, because the colours are the whole vocabulary and a reader who has
     to infer them is reading a puzzle. Business words, not the spec's field
     names: nobody outside this repo knows what a "hook" is. */
  /* In the header, not tucked into a footer corner: a legend nobody finds is
     a legend nobody has. The kinds are structural — a connector, a gap, a
     figure, an object type — so this stays four or five entries whatever the
     domain, and does not grow with the business vocabulary. */
  #legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-left:auto;
          font-size:11px;padding:3px 10px;border:1px solid var(--line);
          border-radius:6px;background:#0e1117}
  #legend span{display:flex;gap:5px;align-items:center;white-space:nowrap;color:var(--ink)}
  #legend i{width:11px;height:11px;border-radius:3px;display:inline-block;
            border:1px solid #2b3140}
  #legend u{width:17px;height:0;border-top:1.5px solid;display:inline-block}
  #legend em{color:var(--dim);font-style:normal;margin-left:5px}
  #legend u.dash{border-top-style:dashed}
  #legend u.dot{border-top-style:dotted;border-top-width:2px}
  .graph-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    padding:8px 16px;border-bottom:1px solid var(--line)}
  .graph-tools .hint{margin-left:auto;font-size:11px;color:var(--dim)}
  #language{margin-left:auto}
  button:disabled{opacity:.4;cursor:default}
  @media (max-width:800px){ main{flex-direction:column} aside{width:auto;height:44%;
    border-left:none;border-top:1px solid var(--line)} }
</style>
</head>
<body>
<header>
  <h1 id="title">sudograph</h1>
  <label><span data-ui="口径">口径</span> <select id="basis"></select></label>
  <span id="dims" style="display:flex;gap:14px;flex-wrap:wrap"></span>
  <label><span data-ui="桥">桥</span> <select id="bridge"></select></label>
  <button id="bridgeBtn" data-ui="桥视图">桥视图</button>
  <label><span data-ui="查看">查看</span> <select id="projection">
    <option value="data" data-ui="数据关系">数据关系</option>
    <option value="all" data-ui="指标与规则">指标与规则</option>
  </select></label>
  <button id="checksBtn" data-ui="检查">检查</button>
  <button id="measureBtn" data-ui="评测题">评测题</button>
  <button id="coverageBtn" data-ui="源库覆盖">源库覆盖</button>
  <button id="challengeBtn" data-ui="盲测题">盲测题</button>
  <select id="language" aria-label="Language"><option value="zh">中文</option><option value="en">English</option></select>
  <span id="legend"></span>
</header>
<div class="graph-tools">
  <button id="fit" data-ui="适应画布">适应画布</button>
  <button id="relayout" data-ui="重新排布">重新排布</button>
  <label><span data-ui="排布">排布</span><select id="direction">
    <option value="auto" data-ui="自动">自动</option>
    <option value="RIGHT" data-ui="从左到右">从左到右</option>
    <option value="DOWN" data-ui="从上到下">从上到下</option>
  </select></label>
  <button id="focusBtn" data-ui="只看相邻关系" disabled>只看相邻关系</button>
  <button id="overviewBtn" data-ui="返回全图" hidden>返回全图</button>
  <button id="instBtn" data-ui="全部展开">全部展开</button>
  <label><input id="sources" type="checkbox"><span data-ui="显示取数来源">显示取数来源</span></label>
  <label><input id="edgeLabels" type="checkbox"><span data-ui="全部关系名称">全部关系名称</span></label>
  <span class="hint" data-ui="拖动节点边缘调整位置；选中文字可评论。">拖动节点边缘调整位置；选中文字可评论。</span>
</div>
<main>
  <div id="cy"></div>
  <aside id="panel"><p class="muted" data-ui="点一个节点看它的来历。">点一个节点看它的来历。</p></aside>
</main>
<footer><span id="status" style="display:flex;gap:16px;flex-wrap:wrap"></span></footer>

<script>
const BUNDLE = __BUNDLE__;
let uiLanguage = BUNDLE.ui.language === 'auto' ? (navigator.language.startsWith('zh')?'zh':'en') : BUNDLE.ui.language;
const t = (key, vars = {}) => {
  const text = BUNDLE.ui.catalogs[uiLanguage][key];
  if (text == null) throw new Error(`Missing UI message: ${key}`);
  return text.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? `{${k}}`);
};
document.documentElement.lang = uiLanguage;
document.querySelectorAll('[data-ui]').forEach(el => el.textContent = t(el.dataset.ui));
document.getElementById('language').value = uiLanguage;
const esc = value => String(value ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const $ = id => document.getElementById(id);
const fmt = v => (typeof v === 'number') ? v.toLocaleString('en-US') : (v ?? '—');
/* Instances are off by default. The scalar graph — raw, hooks, derived figures,
   types — is what a reviewer reads; the rows behind a type are a drill-down. On
   the real pilot the 31 instance nodes outnumber the 15 figures two to one and
   shrink every label past reading, which is the exact complaint that sent us
   away from a static diagram in the first place. Visibility is a view decision,
   so it belongs here; the figures still come only from the compiler. */
const state = { basis: BUNDLE.bases[0], at: {}, bridge: null, bridgeMode: false,
                expanded: new Set(), panel: 'checks', selected:null, focus:null,
                sources:false, edgeLabels:false, direction:'auto',
                projection: Object.values(BUNDLE.views)[0].groups.some(g => g.backing) ? 'data' : 'all' };
$('projection').value = state.projection;
$('projection').onchange = e => { state.projection = e.target.value; draw(); };
$('checksBtn').onclick = () => { state.panel = 'checks'; showChecks(view()); };
$('coverageBtn').onclick = showCoverage;
$('challengeBtn').hidden = !BUNDLE.challenge?.questions?.length;
$('challengeBtn').onclick = showChallenge;
$('measureBtn').onclick = () => { state.panel = 'measure'; showMeasurements(view()); };
$('sources').onchange = e => { state.sources=e.target.checked; draw(); };
$('edgeLabels').onchange = e => { state.edgeLabels=e.target.checked; updateCanvasSelection(); };
$('direction').onchange = e => { state.direction=e.target.value; draw(); };
$('relayout').onclick = () => { clearCanvasLayout(); draw(); };
$('focusBtn').onclick = () => { state.focus=state.selected; draw(); };
$('overviewBtn').onclick = () => { state.focus=null; draw(); };
$('language').onchange = async e => {
  uiLanguage=e.target.value;
  document.documentElement.lang=uiLanguage;
  document.querySelectorAll('[data-ui]').forEach(el=>el.textContent=t(el.dataset.ui));
  document.querySelectorAll('#dims option[value=""]').forEach(el=>el.textContent=t('全部'));
  renderLegend();
  await draw();
};

/* ── controls ──────────────────────────────────────────────────────── */
$('title').textContent = BUNDLE.ontology;

for (const b of BUNDLE.bases) {
  if (b === null) continue;
  const o = document.createElement('option'); o.value = o.textContent = b;
  $('basis').appendChild(o);
}
if (BUNDLE.bases.length === 1 && BUNDLE.bases[0] === null) {
  $('basis').closest('label').style.display = 'none';
}
$('basis').onchange = e => { state.basis = e.target.value; draw(); };

for (const [dim, values] of Object.entries(BUNDLE.axes)) {
  const lab = document.createElement('label');
  lab.textContent = dim + ' ';
  const sel = document.createElement('select');
  for (const v of values) {
    const o = document.createElement('option');
    o.value = v === null ? '' : v;
    o.textContent = v === null ? t('全部') : v;
    sel.appendChild(o);
  }
  sel.onchange = e => {
    if (e.target.value) state.at[dim] = e.target.value; else delete state.at[dim];
    draw();
  };
  lab.appendChild(sel); $('dims').appendChild(lab);
}

for (const br of BUNDLE.bridges) {
  const o = document.createElement('option');
  o.value = br.name; o.textContent = br.label;
  $('bridge').appendChild(o);
}
if (!BUNDLE.bridges.length) {
  $('bridge').closest('label').style.display = 'none';
  $('bridgeBtn').style.display = 'none';
} else {
  state.bridge = BUNDLE.bridges[0].name;
  $('bridge').onchange = e => { state.bridge = e.target.value; draw(); };
  $('bridgeBtn').onclick = () => {
    state.bridgeMode = !state.bridgeMode;
    $('bridgeBtn').classList.toggle('on', state.bridgeMode);
    draw();
  };
}

/* ── the compiler already decided everything; we only look it up ───── */
const coordKey = () =>
  Object.keys(state.at).sort().map(k => `${k}=${state.at[k]}`).join(',');
const view   = () => BUNDLE.views[`${state.basis ?? ''}|${coordKey()}`];
const bridge = () => BUNDLE.diffs[`${state.bridge || defaultBridgeName()}|${coordKey()}`];
function defaultBridgeName() {
  const b = BUNDLE.bridges[0];
  return b ? (b.name || `${b.from}->${b.to}`) : '';
}

/* One table. The renderer colours nodes from it, the legend is built from it,
   and ELK's layer constraint is read from it — so a new kind cannot appear on
   the canvas without a name in the legend and a row to sit on. */
/* `name` is the kind itself and stays abstract — the same five kinds carry an
   restatement, a budget and a stock count, so a name that reads well for one
   would be wrong for the others. `does` is where the plain reading goes: what a
   reader is looking at, and what they can do with it. Both are fixed here, in
   the infra; nothing downstream writes them, which is exactly why they cannot
   borrow a word from whatever the first ontology happened to be about. */
const KINDS = {
  raw:      { var:'--raw',   get name(){return t('取数点')}, get does(){return t('数从哪儿来')}, layer:'FIRST' },
  hook:     { var:'--hook',  get name(){return t('缺口')}, get does(){return t('还差什么')} },
  derived:  { var:'--derived', get name(){return t('算出来的值')} },
  type:     { var:'--type',  get name(){return t('对象类型')}, get does(){return t('点开看每一行')} },
  instance: { var:'--inst'                                                       },
};
const GRADE = { get partial(){return ['#6b5325',t('部分')]}, get missing(){return ['#6e3a2e',t('缺失')]} };
const EDGES = {
  flow:    { dash:'', colour:'--edge', get name(){return t('流向')} },
  guessed: { dash:'dot', colour:'--carried', get name(){return t('我们推断的关联')} },
  affects: { dash:'dash', colour:'--hook', get name(){return t('使它暂定')} },
};
const edgeStyle = rel =>
  EDGES[(rel === 'affects' || rel === 'cites') ? 'affects' : 'flow'];
/* A link the source system maintains and one this ontology worked out are not
   the same claim — the first is someone else's fact, the second is ours to
   defend — so they must not be the same arrow. */
const inferred = e => e.rel === 'links' && e.owner === 'ontology';
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* Certainty is not a second attribute competing with kind for the reader's
   attention — it is the gap colour reaching a figure along the edges. A hook is
   the doubt; anything a hook reaches carries some of it; anything no hook
   reaches is clean. `provisional_because` already says which hooks reach a
   node, so this is that fact rendered rather than a new one.

   Mixed rather than replaced, so the hue still says which kind it is. And it
   falls out per path for free: a chain with no gap upstream stays pure, and one
   with a gap is tinted from the gap downward, which is what "this line is
   settled" looks like without anyone computing a line. */
const PROVISIONAL_MIX = 0.45;
const hex = c => {
  const m = c.match(/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
  return m ? [1, 2, 3].map(i => parseInt(m[i], 16)) : null;
};
const fillOf = n => {
  const base = css((KINDS[n.kind] || KINDS.type).var);
  if (n.kind === 'hook' || !(n.provisional_because || []).length) return base;
  const a = hex(base), b = hex(css('--hook'));
  if (!a || !b) return base;
  const ch = i => Math.round(a[i] + (b[i] - a[i]) * PROVISIONAL_MIX);
  return `rgb(${ch(0)},${ch(1)},${ch(2)})`;
};

function renderLegend() { $('legend').innerHTML =
  `<span><i style="background:${
    (() => { const a = hex(css('--derived')), b = hex(css('--hook'));
      const ch = i => Math.round(a[i] + (b[i] - a[i]) * PROVISIONAL_MIX);
      return `rgb(${ch(0)},${ch(1)},${ch(2)})`; })()
  }"></i>${t('带缺口')}<em>${t('颜色偏橙 = 上游还有缺口')}</em></span>` +
  Object.values(KINDS).filter(k => k.name)
    .map(k => `<span><i style="background:var(${k.var})"></i>${k.name}${
      k.does ? `<em>${k.does}</em>` : ''}</span>`).join('') +
  Object.values(EDGES)
    .map(e => `<span><u class="${e.dash}" style="border-top-color:${
      css(e.colour)}"></u>${e.name}</span>`).join('') +
  `<span>${t('边框')}：` + Object.values(GRADE)
    .map(([c, label]) => `<i style="background:transparent;border-color:${c}"></i>${label}`)
    .join('') + `</span>`;
}
renderLegend();

/* ELK places nodes; Cytoscape handles graph interaction. SVG is a fallback. */
const SVGNS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}) => {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
};
const elk = new ELK();
const pz = { x: 0, y: 0, k: 1 };
let rafReport = null;   // pan and zoom move every anchor; coalesce to one report a frame
let scene = null;

// What a node says, in one place: a list of lines, each a list of parts.
// Measuring and drawing read the same list, so a line added to one cannot go
// missing from the other's box — the fault that had the graph laid out for a
// size it was not drawn at.
//
// A line is a list of parts because a label and the count beside it are not the
// same kind of thing to read: the label is what the node is, the count is how
// much of it there is. Separate parts let the count sit back visually instead
// of competing with the name.
//
// It was first written for a different reason — keeping a comment anchor from
// breaking when the count moves — and that reason turned out to be wrong. The
// anchoring engine resolves either way; what was actually breaking anchors was
// a scoring fault on its side, since fixed. Kept for the reading, not for the
// anchor.
function linesOf(n, open) {
  // An arrow promises that clicking opens something. A type whose rows were
  // never fetched — too many to hold — has nothing to open, so it shows its
  // size without the invitation. Promising and then doing nothing is the fault
  // this already cost us once, on a count that was mistaken for a row count.
  // An arrow is a promise that clicking opens something, so it is offered only
  // when the rows are actually here to be opened. There are two ways for them
  // not to be, and a reader deserves to know which: too many to put on a canvas
  // (the compiler folded them, they exist) versus too many to fetch at all.
  // Offering the arrow regardless opened an empty box, which is the same fault
  // as a count that wore an arrow and did nothing when clicked.
  const n0 = x => x.toLocaleString('en-US');
  const mark = n.kind === 'type' && n.count
    ? (n.unfetched ? `  · ${n0(n.count)} ${t('行')}`
       : n.folded  ? `  · ${n0(n.count)} ${t('行')}`
       : `  ${open ? '▾' : '▸'}${n.count}`)
    : (n.kind === 'hook' && n.waiting_on) ? `  · ${n.waiting_on} ${t('项')}` : null;
  // A plug exists to expose a difference against an independent measure, so the
  // difference goes on the face of it. Showing only the total left the check
  // one click away, which is the same silent absorption the plug is there to
  // prevent.
  const residual = n.residual != null ? `${t('差')} ${fmt(n.residual)}` : null;
  // A backed type wears the table it is a view over. Two boxes reading the same
  // table is how "an object is not a table" becomes visible instead of being
  // something you have to be told.
  // Each line carries what it is, not what position it happens to sit in.
  // Styling by index meant adding a line restyled the one below it — the table
  // a type reads from arrived wearing the bold of a figure.
  const over = n.backing ? t('来源表') + ': ' + n.backing.table : null;
  return [
    { cls: '', parts: mark ? [n.label, mark] : [n.label] },
    n.value != null ? { cls: 'num', parts: [fmt(n.value)] } : null,
    residual ? { cls: 'sub', parts: [residual] } : null,
    over ? { cls: 'sub', parts: [over] } : null,
  ].filter(x => x != null);
}

function measure(lines) {
  // CJK is about one em per character, Latin about half. ELK only needs the
  // extents, not perfection.
  const widest = Math.max(...lines.map(l =>
    [...l.parts.join('')].reduce((w, c) => w + (c.charCodeAt(0) > 0x2e80 ? 12 : 6.6), 0)));
  return { w: Math.min(Math.max(widest + 24, 72), 260), h: 16 + 14 * lines.length };
}

/* One draw at a time, and only the newest survives. `draw` awaits the layout
   engine, so two clicks in quick succession used to run concurrently and
   whichever finished last replaced the canvas — which looked exactly like the
   second click doing nothing. */
/*__CANVAS__*/
/*__RECORDS__*/
let drawSeq = 0;
async function draw() {
  const mine = ++drawSeq;
  const v = view();
  if (!v) { $('status').textContent = 'no view for this combination'; return; }
  $('sources').checked=state.sources || state.projection!=='data';
  $('sources').disabled=state.projection!=='data';

  const d = state.bridgeMode ? bridge() : null;
  const entries = new Set((d?.entries || []).map(e => e.node));
  const carried = new Set((d?.carried || []).map(c => c.node));

  const shown = new Map();
  for (const n of v.nodes) {
    if(state.projection==='data' && n.kind==='raw' && !state.sources)continue;
    if (state.projection === 'data' && !['raw', 'type', 'instance'].includes(n.kind)) continue;
    if(state.projection==='data' && n.kind==='type' && !n.backing)continue;
    if(state.projection==='data' && n.kind==='instance' && !v.groups.find(g=>g.type===n.type)?.backing)continue;
    if (n.kind === 'instance' && !state.expanded.has(n.type)) continue;
    shown.set(n.id, n);
  }
  // A row that is not on the canvas is still inside its type, so an edge that
  // reached the row reaches the type instead of vanishing. Dropping it is how a
  // gap ended up pointing at nothing in the default view: the relation was in
  // the model and drawn nowhere, so the only way to learn that opening that type
  // is where the answer lives was to be told.
  //
  // One edge per pair, not one per row — the count on the gap says how many, and
  // a fan of identical arrows into the same box says nothing extra.
  //
  // `member` is dropped once the rows are nested: it says which type a row
  // belongs to, and the box it sits in already says that.
  //
  // Filtered once, here, so the array the layout is built from and the array
  // the renderer walks are the same one. They were two, indexed independently,
  // and every edge came out attached to the wrong pair.
  const byId = new Map(v.nodes.map(n => [n.id, n]));
  const at = id => {
    const n = byId.get(id);
    return n && n.kind === 'instance' && !state.expanded.has(n.type) ? n.type : id;
  };
  let edges = [];
  const seenEdge = new Set();
  const summaries=new Set(v.edges.filter(e=>e.rel==='links')
    .map(e=>JSON.stringify([e.from,e.to,e.via])));
  for (const e of v.edges) {
    if (e.rel === 'member') continue;
    const from = at(e.from), to = at(e.to);
    if (!shown.has(from) || !shown.has(to)) continue;
    // Collapsed records must not duplicate an existing type-level relationship.
    // Keep the summary (including self references) and its cardinality evidence.
    if(e.rel==='link' && (from!==e.from || to!==e.to) &&
      summaries.has(JSON.stringify([from,to,e.via])))continue;
    const key = JSON.stringify([from, to, e.rel, e.via]);
    if (seenEdge.has(key)) continue;
    seenEdge.add(key);
    edges.push(from === e.from && to === e.to ? e : { ...e, from, to, folded: true });
  }

  if(state.focus && shown.has(state.focus)) {
    const near=new Set([state.focus]);
    for(const e of edges)if(e.from===state.focus||e.to===state.focus){near.add(e.from);near.add(e.to);}
    for(const id of [...near]){const n=shown.get(id);if(n?.type)near.add(n.type);}
    for(const [id,n] of shown)if(n.kind==='instance'&&near.has(n.type))near.add(id);
    for(const id of shown.keys())if(!near.has(id))shown.delete(id);
    edges=edges.filter(e=>shown.has(e.from)&&shown.has(e.to));
  } else state.focus=null;
  $('overviewBtn').hidden=!state.focus;

  if (typeof cytoscape === 'function') return drawCanvas(v, shown, edges, mine);

  // Instances are laid out *inside* their type rather than beside it. Expanding
  // a type used to scatter its rows across the picture with nothing to say where
  // they had come from; nesting them means the answer is the box they are in.
  const box = (n) => {
    const m = measure(linesOf(n, state.expanded.has(n.id)));
    const c = { id: n.id, width: m.w, height: m.h };
    const pin = (KINDS[n.kind] || {}).layer;
    if (pin) c.layoutOptions = { 'elk.layered.layering.layerConstraint': pin };
    return c;
  };
  const kids = new Map();
  for (const n of shown.values())
    if (n.kind === 'instance') (kids.get(n.type) || kids.set(n.type, []).get(n.type)).push(n);

  const children = [];
  for (const n of shown.values()) {
    if (n.kind === 'instance') continue;
    const c = box(n);
    const mine = kids.get(n.id);
    if (mine?.length) {
      c.children = mine.map(box);
      // Same algorithm as the outer graph. A container laid out by a
      // different one cannot have an edge crossing its boundary — ELK throws
      // UnsupportedGraphException — and gaps do point at rows: a hook names the
      // person who owes it. That threw on the second expansion and left the
      // canvas on its previous frame, which read as the click doing nothing.
      c.layoutOptions = {
        ...(c.layoutOptions || {}),
        'elk.padding': `[top=${measure(linesOf(n,true)).h+14},left=14,bottom=14,right=14]`,
        'elk.algorithm': 'layered',
        'elk.direction': 'DOWN',
        'elk.spacing.nodeNode': '14',
        'elk.layered.spacing.nodeNodeBetweenLayers': '20',
        'elk.aspectRatio': '2.6',
      };
    }
    children.push(c);
  }

  const laid = await elk.layout({
    id: 'root',
    layoutOptions: {
      'elk.algorithm': 'layered', 'elk.direction': 'DOWN',
      'elk.layered.spacing.nodeNodeBetweenLayers': '80',
      'elk.spacing.nodeNode': '34',
      'elk.layered.nodePlacement.strategy': 'NETWORK_SIMPLEX',
      'elk.hierarchyHandling': 'INCLUDE_CHILDREN',
      // Left to itself ELK lays this out very wide and very short, which wastes
      // the height and shrinks every label to fit the width.
      'elk.aspectRatio': '1.4',
    },
    children,
    edges: edges.map((e, i) => ({ id: 'e' + i, sources: [e.from], targets: [e.to] })),
  });
  if (mine !== drawSeq) return;

  // Nested children carry coordinates relative to their parent; flatten once so
  // the renderer only ever deals in absolute positions.
  const pos = new Map();
  (function walk(list, ox, oy) {
    for (const c of list || []) {
      pos.set(c.id, { ...c, x: c.x + ox, y: c.y + oy });
      walk(c.children, c.x + ox, c.y + oy);
    }
  })(laid.children, 0, 0);
  const svg = el('svg', { width: '100%', height: '100%' });
  const defs = el('defs');
  for (const [name, e] of Object.entries(EDGES)) {
    const m = el('marker', { id: 'arw-' + name, viewBox: '0 0 10 10', refX: '9',
      refY: '5', markerWidth: '6', markerHeight: '6', orient: 'auto-start-reverse' });
    m.appendChild(el('path', { d: 'M0,0 L10,5 L0,10 z', fill: css(e.colour) }));
    defs.appendChild(m);
  }
  svg.appendChild(defs);
  scene = el('g');
  svg.appendChild(scene);
  const gEdges = el('g'); scene.appendChild(gEdges);
  const gNodes = el('g'); scene.appendChild(gNodes);

  for (const [i, e] of edges.entries()) {
    const sec = (laid.edges || []).find(x => x.id === 'e' + i)?.sections?.[0];
    if (!sec) continue;
    const pts = [sec.startPoint, ...(sec.bendPoints || []), sec.endPoint];
    const p = el('path', {
      d: pts.map((q, j) => (j ? 'L' : 'M') + q.x + ',' + q.y).join(' '),
      fill: 'none',
      'stroke-width': e.rel === 'links' ? 2 : 1.2,
      stroke: css(edgeStyle(e.rel).colour),
      'marker-end': 'url(#arw-' + ((e.rel === 'affects' || e.rel === 'cites') ? 'affects' : 'flow') + ')',
      opacity: e.rel === 'member' ? 0.22 : 0.7,
    });
    if (edgeStyle(e.rel).dash) p.setAttribute('stroke-dasharray', '5 4');
    if (inferred(e)) {
      p.setAttribute('stroke-dasharray', '2 3');
      p.setAttribute('stroke', css('--carried'));
    }
    gEdges.appendChild(p);
  }

  for (const n of shown.values()) {
    const p = pos.get(n.id); if (!p) continue;
    const g = el('g', { transform: 'translate(' + p.x + ',' + p.y + ')', class: 'node' });
    // The hook an identity-based anchor would key on, and what a reader is
    // selecting when they drag across a label today.
    g.dataset.nodeId = n.id;
    g.dataset.kind = n.kind;
    if (n.count) g.dataset.count = n.count;
    if (n.kind === 'type' && state.expanded.has(n.id)) g.dataset.open = '1';
    if (entries.has(n.id)) g.classList.add('entry');
    else if (carried.has(n.id)) g.classList.add('carriedN');
    else if (d) g.classList.add('dim');
    g.appendChild(el('rect', {
      width: p.width, height: p.height, rx: 6,
      fill: fillOf(n),
      stroke: (GRADE[n.completeness] || ['#2b3140'])[0],
      'stroke-width': 2,
    }));
    const open = n.kind === 'type' && state.expanded.has(n.id);
    const lines = linesOf(n, open);
    lines.forEach((line, i) => {
      const t = el('text', {
        x: open ? 10 : p.width / 2,
        y: lines.length === 1 ? 19 : 18 + 16 * i,
        'text-anchor': open ? 'start' : 'middle',
        ...(line.cls ? { class: line.cls } : {}),
      });
      // One tspan per part, so a volatile part never rewrites a stable one.
      line.parts.forEach((part, j) => {
        const span = el('tspan', j ? { class: 'mark' } : {});
        span.textContent = part;
        t.appendChild(span);
      });
      g.appendChild(t);
    });
    // Opening is a click; closing is a control. A click that toggles makes the
    // open state depend on how many times you have clicked, which is unusable
    // for the thing a graph is actually for: pointing at a node and saying
    // something about it. Every such click used to close what you were pointing
    // at, so the second click landed somewhere that no longer existed.
    if (open) {
      const closer = el('g', { class: 'closer' });
      closer.appendChild(el('rect', {
        x: p.width - 26, y: 4, width: 22, height: 20, rx: 5, fill: 'transparent' }));
      const x = el('text', {
        x: p.width - 15, y: 19, 'text-anchor': 'middle', class: 'closer-mark' });
      x.textContent = '×';
      closer.appendChild(x);
      closer.addEventListener('click', ev => {
        ev.stopPropagation();
        state.expanded.delete(n.id);
        draw().then(() => select(n));
      });
      g.appendChild(closer);
    }
    g.addEventListener('click', ev => {
      ev.stopPropagation();
      if (n.kind === 'type' && n.count && !n.unfetched && !n.folded && !open) {
        state.expanded.add(n.id);
        draw().then(() => select(n));
        return;
      }
      select(n);
    });
    gNodes.appendChild(g);
  }

  $('cy').replaceChildren(svg);
  refit();
  // Our layout changed, so every anchor the host is tracking may have moved,
  // appeared or gone.
  anchors.report();

  const bad = v.checks.filter(c => !c.ok);
  $('status').innerHTML =
    `<span>${shown.size} ${t('节点')} · ${edges.length} ${t('边')}</span>` +
    `<span class="${bad.length ? 'fail' : ''}">${v.checks.length - bad.length}/${v.checks.length} ${t('检查通过')}</span>` +
    (d ? `<span>${t('桥')} ${d.bases[0]} → ${d.bases[1]}：${d.entries.length} ${
        d.vocab.entry_noun}，${d.vocab.posted_noun} ${fmt(d.posted)}</span>` : '');

  if (d) showBridge(d);
  else if (state.panel === 'measure') showMeasurements(v);
  else showChecks(v);
}


/* Comment anchors, when the page is opened inside a host that offers them.
   Absent (opened from disk, or comments off) every call below is a no-op, so
   nothing here can be a precondition for the graph working.

   The host asks for identities, never geometry: an anchor is a set of node ids.
   A rectangle is not an identity — it means something different after a
   relayout, and worse, it always resolves, so a comment on a node that has gone
   would silently point at whichever node now occupies that space.

   Three states, and the difference between the last two is the whole point:
     visible  — drawn right now, here is where
     hidden   — we know this id; it is folded away or on another reading
     missing  — we do not know this id at all; the thing itself is gone
   Collapsing hidden into missing would have the page assert that content was
   deleted when it is merely off-screen. */
const anchors = (() => {
  // Resolved on every use, never captured. The host injects its bridge into
  // this frame on its own schedule, and this file is inlined at the top of the
  // document — so reading it once at load binds to nothing and stays bound to
  // nothing for the life of the page, silently. Found exactly that way on the
  // first live run.
  const host = () => (window.__SHAREONE__ || {}).anchors || null;
  let wired = false;

  const known = () => {
    const v = view();
    const ids = new Set(v ? v.nodes.map(n => n.id) : []);
    for (const d of Object.values(BUNDLE.diffs || {}))
      for (const e of d.entries || []) ids.add(e.node);
    return ids;
  };
  const labelOf = id => {
    const n = (view()?.nodes || []).find(x => x.id === id);
    return n ? n.label : id;
  };
  const rectOf = id => {
    if(cy)return canvasRect(id);
    const g = scene && scene.querySelector('g.node[data-node-id="' + CSS.escape(id) + '"]');
    if (!g) return null;
    const r = g.getBoundingClientRect();
    return Number.isFinite(r.x) && r.width >= 0 && r.height >= 0
      ? { x: r.x, y: r.y, width: r.width, height: r.height } : null;
  };

  // Everything the host is tracking, classified. Sent on our own layout
  // changes rather than answered on demand: the page is the only thing that
  // knows a relayout happened, and a round trip per frame is a round trip the
  // pan cannot afford.
  const report = () => {
    const api = host();
    if (!api) return;
    wire(api);
    const have = known();
    api.report([...tracked].map(id => {
      if (!have.has(id)) return { id, state: 'missing' };
      const rect = rectOf(id);
      return rect ? { id, state: 'visible', rect } : { id, state: 'hidden' };
    }));
  };
  const tracked = new Set();

  // Subscribed the first time the host is seen, whenever that turns out to be.
  const wire = api => {
    if (wired) return;
    wired = true;
    api.on('resync', ids => { for (const id of ids || []) tracked.add(id); report(); });
    api.on('hittest', rect => {
      const out = [];
      for (const id of known()) {
        const box=rectOf(id); if(!box)continue;
        const r={...box,right:box.x+box.width,bottom:box.y+box.height};
        if (r.right < rect.x || r.x > rect.x + rect.width) continue;
        if (r.bottom < rect.y || r.y > rect.y + rect.height) continue;
      // Labels, not ids: the host writes the comment's name from these, and it
      // has no way to know what the business calls anything.
        out.push({ id, label: labelOf(id) });
      }
      return out;
    });
  // A hidden anchor is revealed by the page, because only the page knows that
  // this id is a row inside a folded type, or lives under another reading.
    api.on('reveal', ids => {
      let changed = false;
      if(state.focus){state.focus=null;changed=true;}
      if (state.projection === 'data') {
        state.projection = 'all'; $('projection').value = 'all'; changed = true;
      }
      for (const id of ids || []) {
        const t = id.includes('/') ? id.split('/', 1)[0] : null;
        if (t && !state.expanded.has(t)) { state.expanded.add(t); changed = true; }
      }
      if (changed) draw(); else report();
    });
  };

  return { get live() { return !!host(); }, report };
})();

function select(n) {
  if(cy) {state.selected=n.id;state.panel='node';cy.elements().unselect();cy.getElementById(n.id).select();updateCanvasSelection();showNode(n);anchors.report();return;}
  for (const g of scene.querySelectorAll('g.node')) g.classList.remove('hit');
  const mark = id => scene
    .querySelector('g.node[data-node-id="' + CSS.escape(id) + '"]')?.classList.add('hit');
  mark(n.id);
  // Lineage is the question a reviewer actually asks of a figure.
  for (const a of (n.lineage?.ancestors || [])) mark(a);
  showNode(n);
  // Deliberately NOT anchors.select(n): reading a node is not asking to comment
  // on it. `select` tells the host "the user picked this as a comment target",
  // and wiring it to every click made the composer pop open whenever anyone
  // looked at anything. The host drives commenting through its own text and
  // region selection; our side of the contract is report / hittest / reveal.
  anchors.report();
}

function applyTransform() {
  if (rafReport === null) rafReport = requestAnimationFrame(() => {
    rafReport = null;
    anchors.report();
  });
  if (scene) scene.setAttribute('transform',
    'translate(' + pz.x + ',' + pz.y + ') scale(' + pz.k + ')');
}

/* Pointer events rather than mouse events, so a finger, a pen and a mouse all
   take the same path and two fingers pinch. Dropping cytoscape meant giving up
   its input handling; leaving touch out would have made the graph unusable on a
   phone, which is a worse regression than anything this rewrite was for. */
(function wirePanZoom() {
  const host = $('cy');
  const live = new Map();          // pointerId -> {x, y}
  let drag = null, pinch = null;
  //: How far the pointer must travel before a press counts as a drag. Below it
  //: the gesture is still a click, and the pointer must stay uncaptured — a
  //: captured pointer sends every later event to the capturing element, so
  //: pointerup and click land on the canvas instead of on whatever was pressed,
  //: and nothing on the graph can be clicked at all.
  const DRAG_SLOP = 4;
  const dist = ps => Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y);
  const mid  = ps => ({ x: (ps[0].x + ps[1].x) / 2, y: (ps[0].y + ps[1].y) / 2 });

  function zoomAt(k, cx, cy) {
    const box = host.getBoundingClientRect();
    const mx = cx - box.left, my = cy - box.top;
    k = Math.min(Math.max(k, 0.15), 6);
    pz.x = mx - (mx - pz.x) * (k / pz.k);
    pz.y = my - (my - pz.y) * (k / pz.k);
    pz.k = k;
    applyTransform();
  }

  host.addEventListener('pointerdown', e => {
    if(cy)return;
    live.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (live.size === 2) {
      const ps = [...live.values()];
      pinch = { d: dist(ps), k: pz.k };
      drag = null;
      return;
    }
    // A drag that starts on a label is a text selection, and selecting text is
    // how a comment gets anchored — so it is left alone.
    if (cy || e.target.closest('text,.canvas-label')) return;
    // Capture is deliberately NOT taken here. It is taken once the pointer has
    // actually moved, because taking it on press redirects the whole rest of
    // the gesture to this element.
    drag = { x: e.clientX, y: e.clientY, ox: pz.x, oy: pz.y, id: e.pointerId,
             moved: false };
  });

  host.addEventListener('pointermove', e => {
    if (!live.has(e.pointerId)) return;
    if(cy)return;
    live.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && live.size === 2) {
      const ps = [...live.values()], c = mid(ps);
      zoomAt(pinch.k * (dist(ps) / pinch.d), c.x, c.y);
      return;
    }
    // Deliberately keyed on the id recorded at press, not on `e.buttons`: a
    // move during a real drag does not always carry the button state, and a
    // pan that checks it stops dead halfway through the gesture.
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved) {
      if (Math.hypot(dx, dy) < DRAG_SLOP) return;
      drag.moved = true;
      host.style.cursor = 'grabbing';
      // Capture keeps the pan alive when the pointer crosses the frame edge or
      // something that swallows events. It is an improvement to the gesture,
      // not a precondition for it, so it must not be able to break one: it
      // throws whenever the pointer is not a live capturable one, and thrown
      // from here that would abandon the move half-applied.
      try {
        host.setPointerCapture?.(e.pointerId);
        drag.captured = true;
      } catch { /* pan on without it; it simply stops at the boundary */ }
    }
    pz.x = drag.ox + dx;
    pz.y = drag.oy + dy;
    applyTransform();
  });

  const release = e => {
    live.delete(e.pointerId);
    if (live.size < 2) pinch = null;
    if (drag && e.pointerId === drag.id) {
      if (drag.captured) {
        try { host.releasePointerCapture?.(e.pointerId); } catch { /* already gone */ }
      }
      drag = null;
      host.style.cursor = '';
    }
  };
  host.addEventListener('pointerup', release);
  host.addEventListener('pointercancel', release);
  host.addEventListener('pointerleave', release);

  host.addEventListener('wheel', e => {
    if(cy)return;
    e.preventDefault();
    zoomAt(pz.k * Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY);
  }, { passive: false });

  host.addEventListener('click', () => {
    for (const g of (scene?.querySelectorAll('g.node') || [])) g.classList.remove('hit');
  });
})();

function showNode(n) {
  const rows = [];
  rows.push(`<h2>${n.kind}</h2><div style="font-size:15px;font-weight:600">${n.label}</div>`);
  if (n.value != null) rows.push(`<div class="val">${fmt(n.value)}</div>`);
  if (n.completeness)
    rows.push(`<p><span class="tag ${n.completeness}">${n.completeness}</span></p>`);
  if (n.op) rows.push(`<h2>${t('表达式')}</h2><div class="op">${n.op}</div>`);
  if (n.description) rows.push(`<p>${esc(n.description)}</p>`);
  if (n.resolve_when) rows.push(`<h2>${t('解除条件')}</h2><p>${n.resolve_when}</p>`);
  if (n.owner) rows.push(`<div class="kv"><span>${t('负责人')}</span><span>${n.owner}</span></div>`);
  if (n.connector) rows.push(`<h2>${t('取数')}</h2><div class="op">${n.connector}</div>`);
  if (n.backing) {
    rows.push(`<h2>${t('读自')}</h2><div class="op">${n.backing.table}</div>`);
    rows.push(`<div class="kv"><span>${t('标识一行')}</span><span>${n.backing.key.join(', ')}</span></div>`);
    if (n.backing.where)
      rows.push(`<div class="kv"><span>${t('只取')}</span><span>${n.backing.where}</span></div>`);
    if (n.unfetched)
      rows.push(`<p class="muted">${t('{count} 行，没有取进来；它的合计由库直接算。', {count: n.unfetched.toLocaleString('en-US')})}</p>`);
  }
  if (n.provisional_because?.length)
    rows.push(`<h2>${t('因这些缺口而暂定')}</h2><ul>${n.provisional_because.map(h => `<li>${h}</li>`).join('')}</ul>`);
  if (n.lineage?.inputs?.length)
    rows.push(`<h2>${t('直接输入')}</h2><ul>${n.lineage.inputs.map(x => `<li>${x}</li>`).join('')}</ul>`);
  if (n.lineage?.leaves?.length)
    rows.push(`<h2>${t('最终依赖的叶子')}</h2><ul>${n.lineage.leaves.map(x => `<li>${x}</li>`).join('')}</ul>`);
  // A remainder with nowhere named is a remainder that got absorbed, so the
  // two are shown together or not at all.
  if (n.residual != null) {
    rows.push(`<div class="kv"><span>${t('对照')}</span><span>${n.plug_against ?? '—'}</span></div>`);
    rows.push(`<div class="kv"><span>${t('残差')}</span><span>${fmt(n.residual)}</span></div>`);
    rows.push(`<div class="kv"><span>${t('差额挂在')}</span><span>${n.residual_to ?? '—'}</span></div>`);
  }
  // Every property is either an upstream fact or a decision made here, never
  // both. It is the hardest rule in the model and the app was not showing it,
  // which made the panel a list of numbers with no idea who owns any of them.
  if (n.props) {
    const g = view().groups.find(x => x.type === n.type) || {};
    const owners = g.owners || {}, ops = g.ops || {};
    rows.push(`<h2>${t('属性')}</h2>` + Object.entries(n.props).map(([k, val]) =>
      `<div class="kv"><span>${k} <span class="own ${owners[k] || ''}">${
        ops[k] ? t('算出') : owners[k] === 'source' ? t('上游') : owners[k] === 'ontology' ? t('本体') : ''
      }</span></span><span>${fmt(val)}</span></div>` +
      // A computed column shows its formula, exactly as a derived node does.
      (ops[k] ? `<div class="op">${ops[k]}</div>` : '')).join(''));
  }
  if (n.kind === 'type') rows.push(showGroup(n.id));
  $('panel').innerHTML = rows.join('');
  attachBrowse(n);
}

/* Folding produces buckets and a top-N precisely so a folded group still answers
   the two questions a person asks of a long list — how does it break down, and
   which rows carry the weight. Ignoring them made folding mean "hidden". */
function showGroup(tname) {
  const g = view().groups.find(x => x.type === tname);
  if (!g) return '';
  const out = [`<h2>${g.count} ${t('行')}${g.folded ? t('（已折叠）') : ''}</h2>`];
  if (g.columns) {
    out.push(`<h2>${t('列映射')}</h2>` + Object.entries(g.columns).map(([prop, col]) =>
      `<div class="kv"><span>${esc(prop)}</span><span>${esc(col)}</span></div>`).join(''));
  }
  if (g.members?.length && Object.keys(g.ops || {}).length) {
    out.push(`<h2>${t('业务汇总')}</h2>`);
    for (const member of g.members) {
      const label = Object.entries(member.props).find(([k, val]) =>
        k !== g.id_prop && typeof val === 'string')?.[1] ?? member.id;
      out.push(`<details data-object-id="${esc(g.type + '/' + member.id)}"><summary>${esc(label)}</summary>`);
      for (const [prop, op] of Object.entries(g.ops))
        out.push(`<div class="kv"><span>${esc(prop)}</span><span>${fmt(member.props[prop])}</span></div>` +
                 `<div class="op">${esc(op)}</div>`);
      out.push('</details>');
    }
  }
  for (const [axis, buckets] of Object.entries(g.buckets || {})) {
    out.push(`<h2>${t('按 {axis}', {axis})}</h2>`);
    for (const b of buckets) {
      const totals = Object.entries(b.totals || {})
        .map(([c, t]) => `${c} ${fmt(t)}`).join(' · ');
      out.push(`<div class="kv"><span>${b.value ?? '—'} <span class="muted">${
        b.count}</span></span><span>${totals}</span></div>`);
    }
  }
  for (const [col, rows_] of Object.entries(g.top || {})) {
    if (!rows_.length) continue;
    out.push(`<h2>${t('{col} 最大的 {count} 条', {col, count: rows_.length})}</h2>`);
    for (const r of rows_)
      out.push(`<div class="kv"><span>${r.id}</span><span>${fmt(r.value)}</span></div>`);
  }
  return out.join('');
}

// A check is one statement; the rows it is about ride along with it. Showing
// only the sentence would leave a reviewer nothing to verify, and showing every
// row would be the thirty thousand lines this replaced. The sample is the
// middle layer: enough to open one and see the shape.
const checkLine = c =>
  `<div class="entry"><strong>${c.name}</strong>` +
  (c.detail ? `<div class="muted">${c.detail}</div>` : '') +
  (c.sample && c.sample.length
    ? `<div class="muted">${t('例如')} ${c.sample.join('、')}${
        c.affected > c.sample.length ? ` …${t('共 {count} 行', {count: c.affected.toLocaleString('en-US')})}` : ''
      }</div>`
    : '') +
  `</div>`;

function showChecks(v) {
  const bad = v.checks.filter(c => !c.ok);
  // A passing check that is about something — rows missing a value, accounted
  // for — is still worth seeing. "Everything passed" and "21 orders have not
  // shipped, and we know" are different things to tell a reader.
  const noted = v.checks.filter(c => c.ok && c.affected);
  $('panel').innerHTML = (bad.length
    ? `<h2>${t('未通过的检查')}</h2>` + bad.map(checkLine).join('')
    : `<h2>${t('检查')}</h2><p class="muted">${t('{count} 条全部通过。点一个节点看它的来历。', {count: v.checks.length})}</p>`)
    + (noted.length ? `<h2>${t('通过，但有数')}</h2>` + noted.map(checkLine).join('') : '')
    + `<details><summary>${t('全部检查')}</summary>${v.checks.map(checkLine).join('')}</details>`;
  if (state.projection === 'data') $('panel').insertAdjacentHTML('afterbegin',
    `<p class="muted">${t('数据投影：核对对象、列、主键和关联；业务指标在另一视图。')}</p>`);
}

function showMeasurements(v) {
  const run = v.measurement;
  if (!run) { $('panel').textContent = t('暂无可自动生成的题。'); return; }
  const out = [`<h2>${t('评测题')}</h2><p>${t('{passed}/{total} 题通过；分数不阻止修改。', run)}</p>` +
    `<p class="muted">${t('这些题检查计算性质，不证明业务定义正确。')}</p>`];
  for (const q of run.results) {
    const label = v.nodes.find(n => n.id === q.node)?.label ?? q.node;
    const rule = q.generator === 'partition'
      ? t('选中部分 + 排除部分 = 全部（NULL 可能留下缺口）') : t('数据库计算 = 内存逐行计算');
    out.push(`<details class="entry" data-question-id="${esc(q.id)}"><summary>` +
      `<strong>${esc(label)}</strong> · ${t(q.ok ? '通过' : '未通过')}</summary>` +
      `<p>${rule}</p><p class="muted">${t('infra 自动生成')} · ${esc(q.id)}</p>` +
      `<div class="kv"><span>${t('预期')}</span><span>${fmt(q.expected)}</span></div>` +
      `<div class="kv"><span>${t('实际')}</span><span>${fmt(q.got)}</span></div>` +
      `<h2>${t('计算轨迹')}</h2><div class="op">${q.trace.map(esc).join('\n')}</div></details>`);
  }
  if (run.uncovered?.length) out.push(`<h2>${t('未覆盖')}</h2>` +
    run.uncovered.map(q => `<p>${esc(q.node)}: ${esc(q.reason)}</p>`).join(''));
  $('panel').innerHTML = out.join('');
}

// Every trade-specific noun below rides on the diff. The renderer knows that a
// crossing produces things, that some of them land and the rest are carried —
// never what a given trade calls them.
function showBridge(d) {
  const w = d.vocab;
  const part = [`<h2>${w.entry_noun}</h2>`];
  for (const e of d.entries) {
    const lands = Object.entries(e.posts || {});
    part.push(`<div class="entry"><strong>${e.label}</strong>
      <div class="val">${fmt(e.amount)}</div>
      <div class="muted">${fmt(e.before)} → ${fmt(e.after)}</div>
      ${lands.length
        ? `<div>${lands.map(([slot, where]) => `${slot} ${where}`).join(' · ')}</div>`
        : `<div class="muted">${t('仅记录，不计入{total}', {total: w.posted_noun})}</div>`}
      <div class="muted">${t('因为')} ${e.because}</div></div>`);
  }
  part.push(`<div class="kv"><span>${w.posted_noun}</span><span>${fmt(d.posted)}</span></div>`);
  if (d.carried.length) {
    part.push(`<h2>${w.carried_noun}</h2><p class="muted">${t('由上面的{entry}带动，不另计入{total}。', {entry: w.entry_noun, total: w.posted_noun})}</p>`);
    for (const c of d.carried)
      part.push(`<div class="carried"><strong>${c.label}</strong>
        <div>${fmt(c.amount)}</div>
        <div class="muted">${t('来自')} ${c.origins.join('、') || '—'}</div></div>`);
  }
  if (d.unexplained.length)
    part.push(`<h2 class="fail">${t('无法解释')}</h2><ul class="fail">${
      d.unexplained.map(x => `<li>${x}</li>`).join('')}</ul>`);
  $('panel').innerHTML = part.join('');
}

$('instBtn').onclick = () => {
  const all = view().nodes.filter(n => n.kind === 'type' && n.count).map(n => n.id);
  const anyClosed = all.some(t => !state.expanded.has(t));
  state.expanded = new Set(anyClosed ? all : []);
  draw();
};
/* Fit the entire visible graph. Focus and zoom provide a readable local view. */
function refit() {
  if(cy){cy.resize();cy.fit(undefined,45);if(cy.zoom()>1.3){cy.zoom(1.3);cy.center();}anchors.report();return;}
  // Measured from the nodes that were actually placed, not from the root's
  // reported size: with nested children ELK does not fill that in reliably, and
  // fitting to a phantom 1x1 box threw the whole graph off the left edge.
  if (!scene) return;
  const bb = scene.getBBox();
  const W = bb.width || 1, H = bb.height || 1;
  const box = $('cy').getBoundingClientRect();
  if (!box.width || !box.height) return;
  pz.k = Math.max(Math.min((box.width - 60) / W, (box.height - 60) / H, 1.4), 0.85);
  pz.x = (box.width - W * pz.k) / 2 - bb.x * pz.k;
  pz.y = (box.height - H * pz.k) / 2 - bb.y * pz.k;
  applyTransform();
}

/* The container is not its final size when the layout finishes — an embed sizes
   its frame after load, and a window or a phone changes it later. Fitting once
   against a stale viewport is how the right-hand nodes end up clipped, which is
   exactly how this first shipped inside a ShareOne frame. */
new ResizeObserver(() => refit()).observe($('cy'));

$('fit').onclick = refit;
draw();
</script>
</body>
