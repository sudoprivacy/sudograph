types:
  客户:
    label: 客户
    id: 客户号
    backing:
      from: R-NORTHWIND
      table: Customers
      key:
      - CustomerID
    props:
      客户号:
        type: string
        owner: source
        column: CustomerID
      公司名:
        type: string
        owner: source
        column: CompanyName
      联系人:
        type: string
        owner: source
        column: ContactName
        nullable: true
        absent: none
      国家:
        type: string
        owner: source
        column: Country
        nullable: true
        absent: none
      城市:
        type: string
        owner: source
        column: City
        nullable: true
        absent: none
      ContactTitle:
        type: string
        owner: source
        column: ContactTitle
      Address:
        type: string
        owner: source
        column: Address
        nullable: true
        absent: none
      Region:
        type: string
        owner: source
        column: Region
        nullable: true
        absent: none
      PostalCode:
        type: string
        owner: source
        column: PostalCode
        nullable: true
        absent: none
      Phone:
        type: string
        owner: source
        column: Phone
        nullable: true
        absent: none
      Fax:
        type: string
        owner: source
        column: Fax
        nullable: true
        absent: none
    display: 公司名
  订单明细:
    label: 订单明细
    backing:
      from: R-NORTHWIND
      table: Order Details
      key:
      - OrderID
      - ProductID
    props:
      订单号:
        type: ref
        to: 销售订单
        owner: source
        column: OrderID
      产品号:
        type: ref
        to: 产品
        owner: source
        column: ProductID
      成交价:
        type: money
        owner: source
        column: UnitPrice
      数量:
        type: number
        owner: source
        column: Quantity
      折扣:
        type: number
        owner: source
        column: Discount
  产品:
    label: 产品
    id: 产品号
    backing:
      from: R-NORTHWIND
      table: Products
      key:
      - ProductID
    props:
      产品号:
        type: string
        owner: source
        column: ProductID
      名称:
        type: string
        owner: source
        column: ProductName
      品类:
        type: ref
        to: 品类
        owner: source
        column: CategoryID
      标价:
        type: money
        owner: source
        column: UnitPrice
      SupplierID:
        type: ref
        owner: source
        column: SupplierID
        to: 供应商
      QuantityPerUnit:
        type: string
        owner: source
        column: QuantityPerUnit
      UnitsInStock:
        type: number
        owner: source
        column: UnitsInStock
      UnitsOnOrder:
        type: number
        owner: source
        column: UnitsOnOrder
      ReorderLevel:
        type: number
        owner: source
        column: ReorderLevel
      Discontinued:
        type: string
        owner: source
        column: Discontinued
    display: 名称
  品类:
    label: 品类
    id: 品类号
    backing:
      from: R-NORTHWIND
      table: Categories
      key:
      - CategoryID
    props:
      品类号:
        type: string
        owner: source
        column: CategoryID
      名称:
        type: string
        owner: source
        column: CategoryName
      Description:
        type: string
        owner: source
        column: Description
    display: 名称
  承运商:
    label: 承运商
    id: 承运商号
    backing:
      from: R-NORTHWIND
      table: Shippers
      key:
      - ShipperID
    props:
      承运商号:
        type: string
        owner: source
        column: ShipperID
      公司名:
        type: string
        owner: source
        column: CompanyName
      Phone:
        type: string
        owner: source
        column: Phone
    display: 公司名
  销售订单:
    label: 销售订单
    id: 订单号
    backing:
      from: R-NORTHWIND
      table: Orders
      key:
      - OrderID
    props:
      订单号:
        type: string
        owner: source
        column: OrderID
      客户:
        type: ref
        to: 客户
        owner: source
        column: CustomerID
        nullable: true
        absent: none
      下单日:
        type: date
        owner: source
        column: OrderDate
      要求到货日:
        type: date
        owner: source
        column: RequiredDate
        nullable: true
        absent: none
      EmployeeID:
        type: ref
        owner: source
        column: EmployeeID
        to: 员工
      ShipName:
        type: string
        owner: source
        column: ShipName
      ShipAddress:
        type: string
        owner: source
        column: ShipAddress
      ShipCity:
        type: string
        owner: source
        column: ShipCity
      ShipRegion:
        type: string
        owner: source
        column: ShipRegion
      ShipPostalCode:
        type: string
        owner: source
        column: ShipPostalCode
        nullable: true
        absent: none
  发货:
    label: 发货
    id: 订单号
    backing:
      from: R-NORTHWIND
      table: Orders
      key:
      - OrderID
    props:
      订单号:
        type: ref
        owner: source
        column: OrderID
        to: 销售订单
      承运商:
        type: ref
        to: 承运商
        owner: source
        column: ShipVia
        nullable: true
        absent: none
      发货日:
        type: date
        owner: source
        column: ShippedDate
        nullable: true
        absent: none
      运费:
        type: money
        owner: source
        column: Freight
      收货国家:
        type: string
        owner: source
        column: ShipCountry
  客户人口关联:
    label: 客户人口关联
    backing:
      from: R-NORTHWIND
      table: CustomerCustomerDemo
      key:
      - CustomerID
      - CustomerTypeID
    props:
      CustomerID:
        type: ref
        owner: source
        column: CustomerID
        to: 客户
      CustomerTypeID:
        type: ref
        owner: source
        column: CustomerTypeID
        to: 客户人口信息
  客户人口信息:
    label: 客户人口信息
    backing:
      from: R-NORTHWIND
      table: CustomerDemographics
      key:
      - CustomerTypeID
    props:
      CustomerTypeID:
        type: string
        owner: source
        column: CustomerTypeID
      CustomerDesc:
        type: string
        owner: source
        column: CustomerDesc
  员工辖区:
    label: 员工辖区
    backing:
      from: R-NORTHWIND
      table: EmployeeTerritories
      key:
      - EmployeeID
      - TerritoryID
    props:
      EmployeeID:
        type: ref
        owner: source
        column: EmployeeID
        to: 员工
      TerritoryID:
        type: ref
        owner: source
        column: TerritoryID
        to: 辖区
  员工:
    label: 员工
    backing:
      from: R-NORTHWIND
      table: Employees
      key:
      - EmployeeID
    props:
      EmployeeID:
        type: number
        owner: source
        column: EmployeeID
      LastName:
        type: string
        owner: source
        column: LastName
      FirstName:
        type: string
        owner: source
        column: FirstName
      Title:
        type: string
        owner: source
        column: Title
      TitleOfCourtesy:
        type: string
        owner: source
        column: TitleOfCourtesy
      BirthDate:
        type: string
        owner: source
        column: BirthDate
      HireDate:
        type: string
        owner: source
        column: HireDate
      Address:
        type: string
        owner: source
        column: Address
      City:
        type: string
        owner: source
        column: City
      Region:
        type: string
        owner: source
        column: Region
      PostalCode:
        type: string
        owner: source
        column: PostalCode
      Country:
        type: string
        owner: source
        column: Country
      HomePhone:
        type: string
        owner: source
        column: HomePhone
      Extension:
        type: string
        owner: source
        column: Extension
      Notes:
        type: string
        owner: source
        column: Notes
      ReportsTo:
        type: ref
        owner: source
        column: ReportsTo
        nullable: true
        absent: none
        to: 员工
      PhotoPath:
        type: string
        owner: source
        column: PhotoPath
    display: LastName
  地区:
    label: 地区
    backing:
      from: R-NORTHWIND
      table: Regions
      key:
      - RegionID
    props:
      RegionID:
        type: number
        owner: source
        column: RegionID
      RegionDescription:
        type: string
        owner: source
        column: RegionDescription
    display: RegionDescription
  供应商:
    label: 供应商
    backing:
      from: R-NORTHWIND
      table: Suppliers
      key:
      - SupplierID
    props:
      SupplierID:
        type: number
        owner: source
        column: SupplierID
      CompanyName:
        type: string
        owner: source
        column: CompanyName
      ContactName:
        type: string
        owner: source
        column: ContactName
      ContactTitle:
        type: string
        owner: source
        column: ContactTitle
      Address:
        type: string
        owner: source
        column: Address
      City:
        type: string
        owner: source
        column: City
      Region:
        type: string
        owner: source
        column: Region
        nullable: true
        absent: none
      PostalCode:
        type: string
        owner: source
        column: PostalCode
      Country:
        type: string
        owner: source
        column: Country
      Phone:
        type: string
        owner: source
        column: Phone
      Fax:
        type: string
        owner: source
        column: Fax
        nullable: true
        absent: none
      HomePage:
        type: string
        owner: source
        column: HomePage
        nullable: true
        absent: none
    display: CompanyName
  辖区:
    label: 辖区
    backing:
      from: R-NORTHWIND
      table: Territories
      key:
      - TerritoryID
    props:
      TerritoryID:
        type: string
        owner: source
        column: TerritoryID
      TerritoryDescription:
        type: string
        owner: source
        column: TerritoryDescription
      RegionID:
        type: ref
        owner: source
        column: RegionID
        to: 地区
    display: TerritoryDescription
