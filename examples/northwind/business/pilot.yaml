format: sudograph-business-overlay/v2
namespace: northwind-sales-review
baseline:
  manifest: ../../northwind-phase-one/2026-10-10/baseline.json
  sha256: 32cbfad8478051394ea6fbfc1b3f69be3b681151b85e9fafe8ce1160b5a8c938
documents:
  upstream-context:
    uri: https://github.com/jpwhite3/northwind-SQLite3/blob/4f56e7f5906dfd23b25244c5bfe8fb5da6402efd/README.md
    text: '# Northwind-SQLite3


      This is a version of the Microsoft Access 2000 Northwind sample database, re-engineered for SQLite3.


      The Northwind sample database was provided with Microsoft Access as a tutorial schema for managing small business
      customers, orders, inventory, purchasing, suppliers, shipping, and employees. Northwind is an excellent tutorial
      schema for a small-business ERP, with customers, orders, inventory, purchasing, suppliers, shipping, employees,
      and single-entry accounting.


      All the TABLES and VIEWS from the MSSQL-2000 version have been converted to Sqlite3 and included here. Included
      is a single version prepopulated with data. Should you decide to, you can use the included python script to
      pump the database full of more data.


      [Download here](https://raw.githubusercontent.com/jpwhite3/northwind-SQLite3/main/dist/northwind.db)'
    sha256: b314201fdd682370ecfc047ef4aea4d0ce13ea09121ba80eb64145bf8adf54fa
definitions:
  business-context:
    concept: supplied-business-context
    label: Business context from Northwind
    statement: The supplied README describes Northwind as a small-business ERP tutorial covering customers, orders,
      inventory, purchasing, suppliers, shipping and employees.
    origin: provided
    contributor: source
    version: 2
    targets:
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Orders
    evidence:
    - kind: document
      ref: upstream-context
      quote: Northwind is an excellent tutorial schema for a small-business ERP
  extended-price:
    concept: source-extended-price
    label: Source extended-price calculation
    statement: The source view calculates ExtendedPrice from line UnitPrice, Quantity and Discount, including /100
      * 100. This observation preserves the source computation; it does not approve a revenue definition.
    origin: provided
    contributor: source
    version: 2
    targets:
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Order%20Details/field/UnitPrice
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Order%20Details/field/Quantity
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Order%20Details/field/Discount
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Order%20Details%20Extended/field/ExtendedPrice
    evidence:
    - kind: source_sql
      ref: sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Order%20Details%20Extended
      quote: "CREATE VIEW [Order Details Extended] AS\nSELECT [Order Details].OrderID, \n       [Order Details].ProductID,\
        \ \n       Products.ProductName, \n\t   [Order Details].UnitPrice, \n       [Order Details].Quantity, \n\
        \       [Order Details].Discount, \n      ([Order Details].UnitPrice*Quantity*(1-Discount)/100)*100 AS ExtendedPrice\n\
        FROM Products \n     JOIN [Order Details] ON Products.ProductID = [Order Details].ProductID"
  category-source-scope:
    concept: source-category-time-scope
    label: Source category report scope
    statement: Sales by Category groups by category and product and filters OrderDate to 1997. That scope is already
      part of the phase-one source view.
    origin: provided
    contributor: source
    version: 2
    targets:
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Sales%20by%20Category/field/CategoryID
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Sales%20by%20Category/field/ProductSales
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Orders/field/OrderDate
    evidence:
    - kind: source_sql
      ref: sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Sales%20by%20Category
      quote: "CREATE VIEW [Sales by Category] AS\nSELECT Categories.CategoryID, \n       Categories.CategoryName,\
        \ \n         Products.ProductName, \n\tSum([Order Details Extended].ExtendedPrice) AS ProductSales\nFROM\
        \  Categories \n    JOIN Products \n      ON Categories.CategoryID = Products.CategoryID\n       JOIN [Order\
        \ Details Extended] \n         ON Products.ProductID = [Order Details Extended].ProductID              \
        \  \n           JOIN Orders \n             ON Orders.OrderID = [Order Details Extended].OrderID \nWHERE\
        \ Orders.OrderDate BETWEEN DATETIME('1997-01-01') And DATETIME('1997-12-31')\nGROUP BY Categories.CategoryID,\
        \ Categories.CategoryName, Products.ProductName"
  category-question:
    concept: category-sales-scope
    label: 'Category sales: scope to confirm'
    statement: For the business question, should we reuse the source 1997 report or define another reporting period
      and category-level grain? The source view alone does not choose the new business scope.
    origin: inferred
    contributor: model
    version: 2
    targets:
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Sales%20by%20Category/field/ProductSales
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Products/field/CategoryID
  price-meaning:
    concept: unit-price-business-meaning
    label: Catalogue price and order-line price
    statement: 'Proposed meaning: Products.UnitPrice is the catalogue reference price; Order Details.UnitPrice is
      the price used on that order line before its separate Discount. Calculate the transaction from the order-line
      price, quantity and discount. Do not replace a historical order-line price with the product reference price.
      This interpretation uses the source structure and common order models and remains unreviewed.'
    origin: inferred
    contributor: model
    version: 3
    targets:
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Products/field/UnitPrice
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Order%20Details/field/UnitPrice
    evidence:
    - kind: source_sql
      ref: sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Order%20Details%20Extended
      quote: ([Order Details].UnitPrice*Quantity*(1-Discount)/100)*100 AS ExtendedPrice
  rounding-question:
    concept: rounding-policy
    label: Round each line, then add the amounts
    statement: 'Proposed rule: round each order-line amount to the settlement precision, then add the rounded amounts.
      For a currency with two decimal places, an illustrative example is two amounts of 0.335: round each to 0.34
      and add to get 0.68; add first and round 0.670 to get 0.67. These are invented example amounts, not source
      records. Currency, precision and settlement practice still need review. The source SQL has no explicit rounding
      rule. This pilot records a proposal and does not execute it or replace the source amounts.'
    origin: inferred
    contributor: model
    version: 3
    targets:
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Order%20Details%20Extended/field/ExtendedPrice
  tax-freight-question:
    concept: freight-tax-currency
    label: Freight, tax and currency
    statement: The line expression does not reference Freight. Confirm whether the intended sales amount includes
      freight, whether UnitPrice already includes tax and which currency applies. These meanings are not established
      by the expression.
    origin: inferred
    contributor: model
    version: 2
    targets:
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Orders/field/Freight
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Order%20Details/field/UnitPrice
views:
  sales-meaning:
    label: Sales meaning review
    definitions:
    - business-context
    - extended-price
    - category-source-scope
    - category-question
    - price-meaning
    - rounding-question
    - tax-freight-question
  open-questions:
    label: Open business questions
    definitions:
    - category-question
    - price-meaning
    - rounding-question
    - tax-freight-question
translations:
  zh:
    Business context from Northwind: Northwind 提供的业务背景
    ? The supplied README describes Northwind as a small-business ERP tutorial covering customers, orders, inventory,
      purchasing, suppliers, shipping and employees.
    : 原仓库 README 将 Northwind 描述为小企业 ERP 教学示例，涉及客户、订单、库存、采购、供应商、运输和员工。
    Source extended-price calculation: 源库的明细金额计算
    ? The source view calculates ExtendedPrice from line UnitPrice, Quantity and Discount, including /100 * 100.
      This observation preserves the source computation; it does not approve a revenue definition.
    : 源视图使用明细 UnitPrice、Quantity、Discount 计算 ExtendedPrice，包含 /100 * 100。本项记录源库已有计算，不代表已确认收入口径。
    Source category report scope: 源品类报表的时间范围
    ? Sales by Category groups by category and product and filters OrderDate to 1997. That scope is already part
      of the phase-one source view.
    : Sales by Category 按品类和产品分组，筛选 1997 年 OrderDate。这个范围已属于阶段一源视图。
    'Category sales: scope to confirm': 按品类销售额：确认范围
    ? For the business question, should we reuse the source 1997 report or define another reporting period and category-level
      grain? The source view alone does not choose the new business scope.
    : 业务问题应复用源库的 1997 年报表，还是另设报告期间、汇总到品类层级？源视图不能替业务人员选择新的范围。
    Freight, tax and currency: 运费、税与币种
    ? The line expression does not reference Freight. Confirm whether the intended sales amount includes freight,
      whether UnitPrice already includes tax and which currency applies. These meanings are not established by the
      expression.
    : 明细表达式未引用 Freight。需要确认目标销售额是否包含运费、UnitPrice 是否含税、使用什么币种；这些含义不能仅由表达式确定。
    Sales meaning review: 销售口径核对
    Open business questions: 待确认业务问题
    Catalogue price and order-line price: 商品参考价与订单单价
    ? 'Proposed meaning: Products.UnitPrice is the catalogue reference price; Order Details.UnitPrice is the price
      used on that order line before its separate Discount. Calculate the transaction from the order-line price,
      quantity and discount. Do not replace a historical order-line price with the product reference price. This
      interpretation uses the source structure and common order models and remains unreviewed.'
    : 建议解释：商品表 UnitPrice 是目录参考单价；订单明细 UnitPrice 是这笔订单采用的折扣前单价，Discount 另行扣除。核算这笔交易应使用明细单价、数量和折扣；不要拿商品参考价重算历史订单。这是结合源结构与常见订单模型提出的解释，仍待业务确认。
    Round each line, then add the amounts: 建议先逐笔四舍五入，再相加
    ? 'Proposed rule: round each order-line amount to the settlement precision, then add the rounded amounts. For
      a currency with two decimal places, an illustrative example is two amounts of 0.335: round each to 0.34 and
      add to get 0.68; add first and round 0.670 to get 0.67. These are invented example amounts, not source records.
      Currency, precision and settlement practice still need review. The source SQL has no explicit rounding rule.
      This pilot records a proposal and does not execute it or replace the source amounts.'
    : 建议先把每条订单明细金额四舍五入到结算精度，再把这些金额相加。以精确到分的币种为例：两笔各 0.335，逐笔变成 0.34 后相加是 0.68；先相加得到 0.670 再四舍五入是 0.67。这两个数是说明差异的假设例子，不是源库记录。币种、精度和结算惯例仍待确认。源
      SQL 没有显式舍入规则；本试点只记录建议，不执行它，也不覆盖源金额。
