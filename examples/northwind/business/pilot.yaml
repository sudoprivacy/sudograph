format: sudograph-business-overlay/v4
namespace: northwind-sales-review
baseline:
  manifest: ../../northwind-phase-one/2026-10-10/baseline.json
  sha256: 32cbfad8478051394ea6fbfc1b3f69be3b681151b85e9fafe8ce1160b5a8c938
documents:
  upstream-context:
    uri: https://github.com/jpwhite3/northwind-SQLite3/blob/4f56e7f5906dfd23b25244c5bfe8fb5da6402efd/README.md
    text: '# Northwind-SQLite3


      This is a version of the Microsoft Access 2000 Northwind sample database, re-engineered for SQLite3.


      The Northwind sample database was provided with Microsoft Access as a tutorial schema for managing
      small business customers, orders, inventory, purchasing, suppliers, shipping, and employees. Northwind
      is an excellent tutorial schema for a small-business ERP, with customers, orders, inventory, purchasing,
      suppliers, shipping, employees, and single-entry accounting.


      All the TABLES and VIEWS from the MSSQL-2000 version have been converted to Sqlite3 and included
      here. Included is a single version prepopulated with data. Should you decide to, you can use the
      included python script to pump the database full of more data.


      [Download here](https://raw.githubusercontent.com/jpwhite3/northwind-SQLite3/main/dist/northwind.db)'
    sha256: b314201fdd682370ecfc047ef4aea4d0ce13ea09121ba80eb64145bf8adf54fa
definitions:
  business-context:
    concept: supplied-business-context
    label: Business context from Northwind
    statement: The supplied README describes Northwind as a small-business ERP tutorial covering customers,
      orders, inventory, purchasing, suppliers, shipping and employees.
    origin: provided
    contributor: source
    version: 4
    targets:
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Orders
    evidence:
    - kind: document
      ref: upstream-context
      quote: Northwind is an excellent tutorial schema for a small-business ERP
    category: meaning
    role: source_evidence
    applies_to:
    - sales-total
  extended-price:
    concept: source-extended-price
    label: Source extended-price calculation
    statement: The source view calculates ExtendedPrice from line UnitPrice, Quantity and Discount, including
      /100 * 100. This observation preserves the source computation; it does not approve a revenue definition.
    origin: provided
    contributor: source
    version: 4
    targets:
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Order%20Details/field/UnitPrice
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Order%20Details/field/Quantity
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Order%20Details/field/Discount
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Order%20Details%20Extended/field/ExtendedPrice
    evidence:
    - kind: source_sql
      ref: sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Order%20Details%20Extended
      quote: "CREATE VIEW [Order Details Extended] AS\nSELECT [Order Details].OrderID, \n       [Order\
        \ Details].ProductID, \n       Products.ProductName, \n\t   [Order Details].UnitPrice, \n    \
        \   [Order Details].Quantity, \n       [Order Details].Discount, \n      ([Order Details].UnitPrice*Quantity*(1-Discount)/100)*100\
        \ AS ExtendedPrice\nFROM Products \n     JOIN [Order Details] ON Products.ProductID = [Order Details].ProductID"
    category: meaning
    role: source_evidence
    applies_to:
    - sales-total
    - price-meaning
  category-source-scope:
    concept: source-category-time-scope
    label: Source category report scope
    statement: Sales by Category groups by category and product and filters OrderDate to 1997. That scope
      is already part of the phase-one source view.
    origin: provided
    contributor: source
    version: 4
    targets:
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Sales%20by%20Category/field/CategoryID
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Sales%20by%20Category/field/ProductSales
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Orders/field/OrderDate
    evidence:
    - kind: source_sql
      ref: sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Sales%20by%20Category
      quote: "CREATE VIEW [Sales by Category] AS\nSELECT Categories.CategoryID, \n       Categories.CategoryName,\
        \ \n         Products.ProductName, \n\tSum([Order Details Extended].ExtendedPrice) AS ProductSales\n\
        FROM  Categories \n    JOIN Products \n      ON Categories.CategoryID = Products.CategoryID\n\
        \       JOIN [Order Details Extended] \n         ON Products.ProductID = [Order Details Extended].ProductID\
        \                \n           JOIN Orders \n             ON Orders.OrderID = [Order Details Extended].OrderID\
        \ \nWHERE Orders.OrderDate BETWEEN DATETIME('1997-01-01') And DATETIME('1997-12-31')\nGROUP BY\
        \ Categories.CategoryID, Categories.CategoryName, Products.ProductName"
    category: meaning
    role: source_evidence
    applies_to:
    - category-question
  category-question:
    concept: category-sales-scope
    label: 'Annual sales by category: reporting choice'
    statement: For sales management, should the annual order-sales report also show category contributions
      and year-to-year changes? If so, agree the reporting category and historical product-classification
      policy. The existing 1997 category/product view is evidence, not the definition of every annual
      report.
    origin: inferred
    contributor: model
    version: 4
    targets:
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Sales%20by%20Category/field/ProductSales
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Products/field/CategoryID
    category: issue
    role: business
    applies_to:
    - sales-total
  price-meaning:
    concept: unit-price-business-meaning
    label: Historical transaction pricing for annual sales
    statement: 'Proposed annual-sales policy: preserve the price recorded on each historical order line
      and apply that line''s quantity and discount. Never revalue a prior year using today''s product
      catalogue price. This determines which commercial transaction is counted in the annual order-sales
      metric and requires business confirmation.'
    origin: inferred
    contributor: model
    version: 5
    targets:
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Products/field/UnitPrice
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Order%20Details/field/UnitPrice
    evidence:
    - kind: source_sql
      ref: sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Order%20Details%20Extended
      quote: ([Order Details].UnitPrice*Quantity*(1-Discount)/100)*100 AS ExtendedPrice
    category: rule
    role: business
    applies_to:
    - sales-total
  rounding-question:
    concept: rounding-policy
    label: Rounding rule for the proposed sales total
    statement: 'Proposed rule for the order-line amount total: after the reporting scope is chosen, round
      each included line amount to the settlement precision, then sum those amounts. This sums line amounts
      (UnitPrice times Quantity times one minus Discount), not product catalogue prices or unit prices.
      The rule serves the referenced business metric. It is a proposal; currency, precision and settlement
      practice need review, and no new calculation is executed.'
    origin: inferred
    contributor: model
    version: 5
    targets:
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Order%20Details%20Extended/field/ExtendedPrice
    category: rule
    applies_to:
    - sales-total
    role: implementation_note
  tax-freight-question:
    concept: freight-tax-currency
    label: Annual sales inclusion and currency policy
    statement: Before accepting annual order sales, sales and finance must agree whether freight and tax
      belong in the metric, how returns and cancelled orders affect the year, and which currency is reported.
      OrderDate assigns the order year; it does not establish the date of payment or revenue recognition.
      Missing refund, currency or tax data is a definition gap, not proof that the source database is
      wrong.
    origin: inferred
    contributor: model
    version: 4
    targets:
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Orders/field/Freight
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Order%20Details/field/UnitPrice
    category: issue
    role: business
    applies_to:
    - sales-total
  sales-total:
    concept: order-line-sales-amount-total
    category: metric
    label: Annual order sales (proposal)
    statement: 'Proposed sales-management metric: group orders by the calendar year of Orders.OrderDate
      and sum the included order-line amounts for each year, so sales managers can compare annual order
      sales. Use each historical line price, quantity and discount. This measures ordered sales, not cash
      collected or recognised accounting revenue. Freight, tax, currency, cancellations and returns need
      business review before computation. No annual result is executed in this pilot.'
    origin: inferred
    contributor: model
    version: 3
    targets:
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Order%20Details%20Extended/field/ExtendedPrice
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Order%20Details%20Extended/field/OrderID
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Order%20Details%20Extended/field/ProductID
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Orders/field/OrderDate
    grain:
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Order%20Details%20Extended/field/OrderID
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Order%20Details%20Extended/field/ProductID
    scope: 'Each calendar year is a separate result, using OrderDate from January 1 inclusive to the next
      January 1 exclusive. Proposed population: source orders with an order date. Missing dates must be
      reported separately. Currency, returns/cancellations, tax and freight remain unresolved; do not
      silently combine currencies or treat absent records as zero.'
    evidence:
    - kind: source_sql
      ref: sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Order%20Subtotals
      quote: Sum(([Order Details].UnitPrice*Quantity*(1-Discount)/100)*100) AS Subtotal
    role: business
    purpose:
      stakeholder: Sales management
      decision: Compare annual order sales and review the causes of differences between years.
  rounding-impact:
    concept: line-rounding-versus-total-rounding-impact
    category: issue
    label: Rounding order can change a report total
    statement: 'Conditional concern for the proposed report total: if included line amounts carry more
      decimals than settlement precision, rounding each line and rounding only the final total can differ.
      For two invented line amounts of 0.335 in a two-decimal currency, round then sum gives 0.68, whereas
      sum then round gives 0.67. These are explanatory examples, not source records; no claim is made
      that this dataset or the business has already suffered a discrepancy. Review this issue before accepting
      the rule.'
    origin: inferred
    contributor: model
    version: 2
    targets:
    - sg-source/e22151e697c322748d7fa3fc3b0e48e5/object/Order%20Details%20Extended/field/ExtendedPrice
    applies_to:
    - sales-total
    - rounding-question
    role: implementation_note
views:
  sales-meaning:
    label: Annual order-sales review
    definitions:
    - sales-total
    - price-meaning
    - tax-freight-question
    - category-question
  open-questions:
    label: Annual-sales decisions to confirm
    definitions:
    - tax-freight-question
    - category-question
translations:
  zh:
    Business context from Northwind: Northwind 提供的业务背景
    ? The supplied README describes Northwind as a small-business ERP tutorial covering customers, orders,
      inventory, purchasing, suppliers, shipping and employees.
    : 原仓库 README 将 Northwind 描述为小企业 ERP 教学示例，涉及客户、订单、库存、采购、供应商、运输和员工。
    Source extended-price calculation: 源库的明细金额计算
    ? The source view calculates ExtendedPrice from line UnitPrice, Quantity and Discount, including /100
      * 100. This observation preserves the source computation; it does not approve a revenue definition.
    : 源视图使用明细 UnitPrice、Quantity、Discount 计算 ExtendedPrice，包含 /100 * 100。本项记录源库已有计算，不代表已确认收入口径。
    Source category report scope: 源品类报表的时间范围
    ? Sales by Category groups by category and product and filters OrderDate to 1997. That scope is already
      part of the phase-one source view.
    : Sales by Category 按品类和产品分组，筛选 1997 年 OrderDate。这个范围已属于阶段一源视图。
    Rounding rule for the proposed sales total: 订单明细金额总额的舍入规则
    ? 'Proposed rule for the order-line amount total: after the reporting scope is chosen, round each
      included line amount to the settlement precision, then sum those amounts. This sums line amounts
      (UnitPrice times Quantity times one minus Discount), not product catalogue prices or unit prices.
      The rule serves the referenced business metric. It is a proposal; currency, precision and settlement
      practice need review, and no new calculation is executed.'
    : 建议用于“订单明细金额总额”的规则：先选定报表范围，把纳入范围的每条明细金额按结算精度四舍五入，再求这些金额的总和。相加的是明细金额（单价 × 数量 × 折扣因子），不是商品标价或单价。本规则服务于连线指向的业务指标。币种、精度和结算惯例仍待确认；本版没有执行新的计算。
    Rounding order can change a report total: 舍入顺序可能影响报表总额
    ? 'Conditional concern for the proposed report total: if included line amounts carry more decimals
      than settlement precision, rounding each line and rounding only the final total can differ. For
      two invented line amounts of 0.335 in a two-decimal currency, round then sum gives 0.68, whereas
      sum then round gives 0.67. These are explanatory examples, not source records; no claim is made
      that this dataset or the business has already suffered a discrepancy. Review this issue before accepting
      the rule.'
    : 针对候选报表总额的条件性问题：如果明细金额的小数位多于结算精度，逐笔舍入和只在总额上舍入可能得到不同结果。以精确到分的币种、两笔假设金额各 0.335 为例，逐笔舍入再相加得 0.68，先相加再舍入得
      0.67。这是解释差异的例子，不是源库记录，也不表示已发现这个数据集或实际业务存在差额。确认规则前应核对这一问题。
    Annual order sales (proposal): 年度订单销售额（草案）
    ? 'Proposed sales-management metric: group orders by the calendar year of Orders.OrderDate and sum
      the included order-line amounts for each year, so sales managers can compare annual order sales.
      Use each historical line price, quantity and discount. This measures ordered sales, not cash collected
      or recognised accounting revenue. Freight, tax, currency, cancellations and returns need business
      review before computation. No annual result is executed in this pilot.'
    : 面向销售管理的候选指标：按 Orders.OrderDate 所属自然年归集订单，分别汇总各年纳入范围的订单明细金额，用于比较年度订单销售额。使用历史订单的明细单价、数量和折扣。这衡量已下单的销售金额，不等同于回款或会计确认收入。运费、税、币种、取消和退货的口径仍待业务确认；本试点尚未计算年度结果。
    ? 'Each calendar year is a separate result, using OrderDate from January 1 inclusive to the next January
      1 exclusive. Proposed population: source orders with an order date. Missing dates must be reported
      separately. Currency, returns/cancellations, tax and freight remain unresolved; do not silently
      combine currencies or treat absent records as zero.'
    : 每个自然年分别出结果，使用 OrderDate，从当年 1 月 1 日（含）到次年 1 月 1 日（不含）。候选范围为源库有下单日期的订单；缺失日期须单独报告。币种、退货或取消、税和运费尚未确认；不能默认混合币种，也不能把不存在的记录视为零。
    Sales management: 销售管理人员
    Compare annual order sales and review the causes of differences between years.: 比较年度订单销售额，核对跨年差异的业务原因。
    Historical transaction pricing for annual sales: 年度销售额采用历史成交价
    ? 'Proposed annual-sales policy: preserve the price recorded on each historical order line and apply
      that line''s quantity and discount. Never revalue a prior year using today''s product catalogue
      price. This determines which commercial transaction is counted in the annual order-sales metric
      and requires business confirmation.'
    : 年度销售额的候选口径：采用历史订单明细记录的单价，并按该行数量和折扣计算。不能用今天的商品目录价格重估往年销售额。本规则决定年度订单销售额计入哪笔成交金额，仍须业务确认。
    'Annual sales by category: reporting choice': 年度销售额是否按品类拆分
    ? For sales management, should the annual order-sales report also show category contributions and
      year-to-year changes? If so, agree the reporting category and historical product-classification
      policy. The existing 1997 category/product view is evidence, not the definition of every annual
      report.
    : 面向销售管理，年度订单销售额是否还要展示各品类贡献和跨年变化？如果需要，须确认报表采用的品类口径及历史商品分类方式。源库现有的 1997 年品类／产品视图可作为证据，不替代新的年度报表定义。
    Annual sales inclusion and currency policy: 年度销售额的纳入范围与币种
    ? Before accepting annual order sales, sales and finance must agree whether freight and tax belong
      in the metric, how returns and cancelled orders affect the year, and which currency is reported.
      OrderDate assigns the order year; it does not establish the date of payment or revenue recognition.
      Missing refund, currency or tax data is a definition gap, not proof that the source database is
      wrong.
    : 确认年度订单销售额前，销售与财务须对齐：是否计入运费和税、退货或取消订单归入哪一年、报表采用什么币种。OrderDate 只确定下单年份，不能证明回款或收入确认日期。缺少退货、币种或税信息是口径缺口，不代表源数据库错误。
    Annual order-sales review: 年度订单销售额核对
    Annual-sales decisions to confirm: 年度销售额待确认决策
