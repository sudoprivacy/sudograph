# Real-scale fixture: the outsourcing capitalisation ledger.
#
# Generated from 09_委外资本化台账/, where the filename IS the data
# (供应商__认定__状态[__期=额]…). Supplier names are replaced by codes; the
# determination, status and amounts are real, because those are what the
# compiler has to get right.
ontology: 委外资本化-实测

# 两套口径，一套结构。账面是公司账上的做法，重述是材料支持得住的做法。
# 只有真正不同的表达式写两遍；其余节点单一来源，不可能漂。两者之间的调整分录
# 由 compiler 算出来，不是手写的 —— 底稿里那句「手工映射·待结构改造」就是被
# 这个替掉的。
bases: [账面, 重述]

types:
  委外合同:
    label: 委外开发合同（按期间拆分）
    description: 一家供应商在一个报告期内的委外开发投入，是资本化判定的最小单位
    id: 合同编号
    period: 期间
    props:
      合同编号:    { type: string, owner: source,   from: R-LEDGER }
      供应商:      { type: string, owner: source,   from: R-LEDGER }
      期间:        { type: string, owner: source,   from: R-LEDGER }
      认定:        { type: enum,   owner: ontology, values: [资本化, 费用化, 待坐实] }
      状态:        { type: enum,   owner: ontology, values: [已确认, 估, 未坐实, 已否, 待合同HOOK, 待IP条款] }
      金额_不含税:  { type: money,  owner: ontology, nullable: true, absent: gap, note: "万元转元；含税口径已按 6% 专票进项调减" }
      缺口:        { type: ref,    owner: ontology, to: hook, nullable: true }

  人:
    label: 项目相关人
    id: 工号
    props:
      工号:   { type: string, owner: source,   from: R-ROSTER }
      姓名:   { type: string, owner: source,   from: R-ROSTER }
      角色:   { type: enum,   owner: ontology, values: [供应商对接, 财务, 项目合伙人, 顾问] }
      联系:   { type: string, owner: source,   from: R-ROSTER }

  账面委外:
    label: 金蝶账面的委外投入行
    id: 科目
    period: 期间
    props:
      科目:  { type: string, owner: source, from: R-KINGDEE }
      期间:  { type: string, owner: source, from: R-KINGDEE }
      金额:  { type: money,  owner: source, from: R-KINGDEE }

raw:
  R-ROSTER:
    label: 项目人员名册
    connector: "python -m roster.export --project shudu"
    provides: [工号, 姓名, 联系]
  R-KINGDEE:
    label: 金蝶 GL 的委外投入科目
    connector: "python -m ai_dev_browser.tools.download --profile kingdee --path 科目余额表"
    provides: [科目, 期间, 金额]
  R-LEDGER:
    label: 委外资本化台账（文件名即数据）
    connector: "python -m ledger.parse --dir 05_研发资本化底料/09_委外资本化台账"
    provides: [合同编号, 供应商, 期间]

hooks:
  H-待合同:
    label: 合同原件未到，金额为估
    blocked_on: R-LEDGER
    resolve_when: "取得合同原件并读出 IP 条款"
    owner: 人/P-01
    affects: [委外cap, 待坐实金额]
  H-费用化无金额:
    label: 判定费用化且台账未列金额的条目
    blocked_on: R-LEDGER
    resolve_when: "台账文件名补上金额段，或确认该条确为零"
    owner: 人/P-01
    affects: [费用化金额]
  H-台账账面差:
    label: 台账合计与金蝶账面委外投入的差额
    blocked_on: R-LEDGER
    resolve_when: "逐笔核对台账与金蝶 GL，差额归零或说明原因"
    owner: 人/P-01
    affects: [台账账面差]
  H-待IP条款:
    label: 合同已到但未约定知识产权归属
    blocked_on: R-LEDGER
    resolve_when: "取得补充协议明确 IP 归甲方"
    owner: 人/P-01
    affects: [委外cap, 待坐实金额]

instances:
  人:
    - { 工号: P-01, 姓名: 对接人甲, 角色: 供应商对接, 联系: "wecom:jia" }
    - { 工号: P-02, 姓名: 合伙人乙, 角色: 项目合伙人, 联系: "wecom:yi" }

  账面委外:
    - { 科目: "5301-委外开发-2023", 期间: '2023', 金额: 7170000 }
    - { 科目: "5301-委外开发-2025", 期间: '2025', 金额: 9498000 }
    - { 科目: "5301-委外开发-26H1", 期间: '26H1', 金额: 10152000 }
  委外合同:
    - { 合同编号: W-001, 供应商: 供应商01, 期间: 26H1, 认定: 资本化, 状态: 已确认, 金额_不含税: 790000 }
    - { 合同编号: W-002, 供应商: 供应商02, 期间: 26H1, 认定: 资本化, 状态: 已确认, 金额_不含税: 1899000 }
    - { 合同编号: W-003, 供应商: 供应商03, 期间: 26H1, 认定: 资本化, 状态: 已确认, 金额_不含税: 280000 }
    - { 合同编号: W-004, 供应商: 供应商04, 期间: 26H1, 认定: 资本化, 状态: 待合同HOOK, 金额_不含税: 4036000, 缺口: H-待合同 }
    - { 合同编号: W-005, 供应商: 供应商05, 期间: '2025', 认定: 资本化, 状态: 已确认, 金额_不含税: 4315000 }
    - { 合同编号: W-006, 供应商: 供应商06, 期间: '2025', 认定: 资本化, 状态: 已确认, 金额_不含税: 4366000 }
    - { 合同编号: W-007, 供应商: 供应商07, 期间: '2025', 认定: 资本化, 状态: 已确认, 金额_不含税: 817000 }
    - { 合同编号: W-008, 供应商: 供应商07, 期间: 26H1, 认定: 资本化, 状态: 已确认, 金额_不含税: 1226000 }
    - { 合同编号: W-009, 供应商: 供应商08, 期间: '未列期', 认定: 费用化, 状态: 已否, 金额_不含税: 0 }
    - { 合同编号: W-010, 供应商: 供应商09, 期间: 26H1, 认定: 资本化, 状态: 待合同HOOK, 金额_不含税: 500000, 缺口: H-待合同 }
    - { 合同编号: W-011, 供应商: 供应商10, 期间: 26H1, 认定: 费用化, 状态: 已否, 金额_不含税: 0 }
    - { 合同编号: W-012, 供应商: 供应商11, 期间: 26H1, 认定: 资本化, 状态: 待IP条款, 金额_不含税: 1297000, 缺口: H-待IP条款 }
    - { 合同编号: W-013, 供应商: 供应商12, 期间: '2023', 认定: 资本化, 状态: 已确认, 金额_不含税: 3774000 }
    - { 合同编号: W-014, 供应商: 供应商13, 期间: '未列期', 认定: 费用化, 状态: 已否, 金额_不含税: 0 }
    - { 合同编号: W-015, 供应商: 供应商14, 期间: 26H1, 认定: 资本化, 状态: 待IP条款, 金额_不含税: 792000, 缺口: H-待IP条款 }
    - { 合同编号: W-016, 供应商: 供应商15, 期间: '2023', 认定: 资本化, 状态: 已确认, 金额_不含税: 3396000 }

nodes:
  委外cap:
    kind: derived
    label: 委外资本化额
    # 账面：凡判定资本化的全部入账。重述：只认材料坐实的那部分。
    # 差额 = 本次重分类的金额，由 compiler 算，不手写。
    op@账面: "sum(委外合同 where 认定 == '资本化' -> 金额_不含税)"
    op@重述: "sum(委外合同 where 认定 == '资本化' and 状态 == '已确认' -> 金额_不含税)"
    because: H-待合同
    entry:
      debit: 研发费用-委外
      credit: 开发支出-委外
  待坐实金额:
    kind: derived
    label: 尚待材料坐实的金额
    # 账面上没有这个桶——所以是 "0"，不是留空。留空和「还没算」长得一样。
    op@账面: "0"
    op@重述: "sum(委外合同 where 认定 == '资本化' and 状态 != '已确认' -> 金额_不含税)"
    because: H-待合同
  委外合计:
    kind: derived
    label: 台账口径合计（含待坐实）
    op: "委外cap + 待坐实金额"
  费用化金额:
    kind: derived
    label: 判定为费用化的金额
    op: "sum(委外合同 where 认定 == '费用化' -> 金额_不含税)"
  账面委外投入:
    kind: derived
    label: 金蝶账面的委外投入（独立度量）
    op: "sum(账面委外 -> 金额)"
  台账账面差:
    kind: derived
    label: 台账合计与账面之差（平衡项）
    op: "委外合计"
    plug_against: 账面委外投入
    residual_to: H-台账账面差
  合同笔数:
    kind: derived
    label: 台账条目数
    op: "count(委外合同)"

ops:
  坐实资本化:
    label: 材料补齐后把一条从待坐实改为已确认
    class: DerivedOp
    params:
      合同:  { type: ref,  to: 委外合同 }
      状态:  { type: enum, values: [已确认, 已否] }
      依据:  { type: ref,  to: [raw, hook] }
    writes: [状态, 缺口]
    intent: required
  更正金额:
    label: 按含税口径更正金额（不可逆，需人确认）
    class: RecordableOp
    params:
      合同:    { type: ref,   to: 委外合同 }
      新金额:  { type: money }
      依据:    { type: ref,   to: [raw, hook] }
    writes: [金额_不含税]
    intent: required

# Articulation assertions — the unit tier. Pure computation over node values,
# run on every compile. Failing one means the ontology disagrees with itself.
checks:
  合计闭合: "委外合计 == 委外cap + 待坐实金额"
  # Whole-ledger figures are asserted only when no period is selected.
  台账总额: { expr: "委外合计 == 27488000", period: null }
  二三年合计: { expr: "委外合计 == 7170000", period: "2023" }
  二五年合计: { expr: "委外合计 == 9498000", period: "2025" }
  二六上半年合计: { expr: "委外合计 == 10820000", period: "26H1" }
  资本化非负: "委外cap >= 0"
  待坐实不超总额: "待坐实金额 <= 委外合计"
